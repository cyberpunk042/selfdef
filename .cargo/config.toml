# Build-time cargo configuration.
# https://doc.rust-lang.org/cargo/reference/config.html

[build]
# Use sparse protocol for faster index updates (Rust 1.68+)
# Set in cargo's global config if you want, kept here for reference.

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-Wl,--as-needed",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-Wl,--as-needed",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
]

[net]
git-fetch-with-cli = true

# Aliases for build-helper tasks. See `xtask/src/main.rs`.
[alias]
xtask = "run --quiet --package xtask --"
