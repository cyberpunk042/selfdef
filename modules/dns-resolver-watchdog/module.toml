name        = "dns-resolver-watchdog"
version     = "0.1.0"
summary     = "Daily + boot delta of the active DNS resolver set (/etc/resolv.conf nameservers + /etc/hosts override count) vs a learned baseline. A CHANGED nameserver is a DNS-hijack indicator — attacker repoints resolution to a malicious resolver to MITM updates/downloads (T1584.002 / T1565.001)"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["dns-resolver-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any CHANGED nameserver set
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/dns-resolver-watchdog.toml",
    "/usr/local/libexec/selfdef/dns-resolver-watchdog.sh",
    "/etc/systemd/system/selfdef-dns-resolver.service",
    "/etc/systemd/system/selfdef-dns-resolver.timer",
    "/var/lib/selfdef/dns-resolver-baseline.tsv",
]
