name        = "hidden-process-watchdog"
version     = "0.1.0"
summary     = "Detect rootkit-hidden processes by comparing the kernel-authoritative PID set (brute-force /proc/<pid> stat across the full PID range) against what readdir(/proc) + ps report. A PID that is alive but absent from the directory listing is the userland/LKM-rootkit hidden-process signature (T1014)"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["hidden-process-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log findings; exit 0
# `enforce`          — exit 1 if any hidden PID detected
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/hidden-process-watchdog.toml",
    "/usr/local/libexec/selfdef/hidden-process-watchdog.sh",
    "/etc/systemd/system/selfdef-hidden-process.service",
    "/etc/systemd/system/selfdef-hidden-process.timer",
]
