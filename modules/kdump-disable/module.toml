name        = "kdump-disable"
version     = "0.1.0"
summary     = "Disable kdump.service / kexec-tools.service — eliminates kernel-memory-on-panic dump that would contain every process's secret material. Mitigates T1003 OS Credential Dumping (via vmcore)"
category    = "hardening"

depends_on  = []
conflicts   = []
provides    = ["kdump-disable"]
consumes    = []

requires    = [
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `mask` (default) — stop + disable + MASK kdump.service (and
#                   kexec-tools.service if present). Operator can
#                   re-enable only via explicit `systemctl unmask`.
# `stop`          — stop + disable only. Operator-pull re-enable
#                   via systemctl start.
default = "mask"
available = ["mask", "stop"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/kdump-disable.toml",
]
