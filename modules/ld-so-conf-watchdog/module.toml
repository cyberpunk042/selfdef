name        = "ld-so-conf-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the dynamic-linker search-path config (/etc/ld.so.conf + /etc/ld.so.conf.d/*) vs a learned baseline. An attacker who prepends a writable dir (e.g. /tmp, /opt/evil) to the linker search path makes ld.so prefer a trojaned .so over the real system library — persistent SO-search-order hijack (T1574.001). Distinct from ld-preload-watchdog (the LD_PRELOAD env-var vector)"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["ld-so-conf-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any search-path change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/ld-so-conf-watchdog.toml",
    "/usr/local/libexec/selfdef/ld-so-conf-watchdog.sh",
    "/etc/systemd/system/selfdef-ld-so-conf.service",
    "/etc/systemd/system/selfdef-ld-so-conf.timer",
    "/var/lib/selfdef/ld-so-conf-baseline.tsv",
]
