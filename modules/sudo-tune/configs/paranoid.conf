# selfdef sudo-tune — paranoid profile.
#
# audit-trail's defaults + tighter timestamp + always-lecture.

# === Logging (same as audit-trail) ===
Defaults log_year
Defaults logfile="/var/log/sudo.log"
Defaults iolog_dir="/var/log/sudo-io"
Defaults log_input
Defaults log_output

# === Even tighter timestamp ===
Defaults timestamp_timeout=2
Defaults timestamp_type=tty

# === Always-lecture (every invocation, not once-per-user) ===
Defaults lecture=always
Defaults lecture_file="/etc/selfdef/sudo-lecture.txt"

# === Never feedback ===
Defaults !pwfeedback

# === PTY always ===
Defaults use_pty

# === Reject empty environment (force PATH reset on every sudo) ===
Defaults secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
Defaults env_reset
