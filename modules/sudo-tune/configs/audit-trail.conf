# selfdef sudo-tune — audit-trail profile (default).
#
# Installed at /etc/sudoers.d/50-selfdef-tune via `visudo -cf`
# validation before commit. Composes with the operator's sudoers
# + sudoers.d/ ruleset.
#
# Defaults (note: this file MUST end with newline + be syntactically
# valid sudo Defaults syntax).

# === Logging ===
# Full-year timestamps (default omits the year — useless for
# multi-month forensic timelines).
Defaults log_year

# Operator-readable sudo session log (auth attempts, command
# invoked, exit code).
Defaults logfile="/var/log/sudo.log"

# === I/O session recording ===
# Records keyboard input + terminal output for every sudo'd
# command. Operator-readable replay via `sudoreplay <session-id>`.
# Audit trail for forensic incident response.
Defaults iolog_dir="/var/log/sudo-io"
Defaults log_input
Defaults log_output

# === Tightened timestamp behavior ===
# Default timestamp_timeout=15min lets a single sudo unlock 15min
# of subsequent sudos without password. Tighten to 5min so an
# attacker who hijacks an unattended terminal has at most 5min of
# elevated access before re-prompting.
Defaults timestamp_timeout=5

# Per-tty timestamps so a sudo in one terminal doesn't unlock
# another terminal's sudo prompt (mitigates T1548.003 sudo-cache
# abuse).
Defaults timestamp_type=tty

# === Always require password (no NOPASSWD shortcuts) ===
# Note: this DOES NOT undo NOPASSWD rules already declared in
# /etc/sudoers or sibling files — sudo's parse is "last
# matching rule wins". Operator-declared NOPASSWD rules at
# 99-operator-nopasswd take precedence over this default.
# Defaults !authenticate    # (intentionally NOT set — we want auth)

# === Operator-readable lecture (informs operator of policy) ===
# Default is once-per-user. Switch to always so the operator sees
# the sudo policy reminder every invocation (raises situational
# awareness).
Defaults lecture=once

# === Disable password feedback (asterisks) ===
# Default pwfeedback=off means typing the sudo password shows
# NOTHING (no asterisks). Keep this — pwfeedback's asterisks
# leak password LENGTH to a shoulder-surfer.
Defaults !pwfeedback

# === Use PAM session ===
# Default on every modern distro; pinned here so other modules
# can't accidentally drift it off.
Defaults use_pty
