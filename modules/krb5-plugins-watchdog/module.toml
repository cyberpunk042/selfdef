name        = "krb5-plugins-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the MIT Kerberos config plugin registrations (/etc/krb5.conf, /etc/krb5.conf.d/*.conf [plugins] section) vs a learned baseline + ownership + module-path scan. The krb5 [plugins] section's `module = <interface>:<path>` lines load .so plugins (clpreauth, kdcpreauth, pwqual, kadm5_hook, certauth, localauth, hostrealm, …) into kinit, the KDC (krb5kdc), kadmind, sshd's GSSAPI, and sssd — so a planted `module = clpreauth:/tmp/evil.so` loads attacker code directly into the Kerberos authentication path (T1574 hijack execution flow / T1556 modify authentication process). Distinct from gss-mech-watchdog (GSSAPI mechanism glue) and pkcs11-modules-watchdog: this is the MIT-krb5 plugin-interface surface. A module path under /tmp /home /dev/shm /var/tmp or relative-with-slash, a world-writable/non-root krb5 config, or any added module is the signature. No-ops cleanly when no krb5 config is present"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["krb5-plugins-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any krb5 plugin change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/krb5-plugins-watchdog.toml",
    "/usr/local/libexec/selfdef/krb5-plugins-watchdog.sh",
    "/etc/systemd/system/selfdef-krb5-plugins.service",
    "/etc/systemd/system/selfdef-krb5-plugins.timer",
    "/var/lib/selfdef/krb5-plugins-baseline.tsv",
]
