name        = "rsh-telnet-disable"
version     = "0.1.0"
summary     = "Mask the legacy cleartext-protocol daemons if present — telnet, rsh/rlogin/rexec, tftp, finger. All transmit credentials or data in cleartext and have no place on a 2026 host. CIS 2.2.x. No-op where they're absent (the common case)"
category    = "hardening"

depends_on  = []
conflicts   = []
provides    = ["legacy-cleartext-services-disabled"]
consumes    = []

requires    = [
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `mask` (default) — stop + disable + mask the legacy unit set
# `stop`           — stop + disable only
default = "mask"
available = ["mask", "stop"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/rsh-telnet-disable.toml",
]
