# selfdef tmpfs-baseline tmpfs profile — tmp.mount drop-in.
#
# Re-mounts /tmp as tmpfs (RAM-backed; ephemeral across reboot).
# Size capped at 25% of RAM. + noexec/nosuid/nodev.
#
# Tradeoff: very large /tmp uses (build artifacts, video editing
# scratch space) will fail with ENOSPC at the 25% RAM threshold.
# Operator overrides size= via 60-operator.conf if needed.

[Unit]
ConditionPathIsSymbolicLink=!/tmp
ConditionDirectoryNotEmpty=|!/tmp
Description=Temporary Directory /tmp (tmpfs, hardened)
DefaultDependencies=no
Conflicts=umount.target
Before=local-fs.target umount.target

[Mount]
What=tmpfs
Where=/tmp
Type=tmpfs
Options=mode=1777,strictatime,nosuid,nodev,noexec,size=25%
