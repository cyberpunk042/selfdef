# selfdef tmpfs-baseline noexec profile — tmp.mount drop-in.
#
# Composed by systemd with /usr/lib/systemd/system/tmp.mount.
# Adds noexec + nosuid + nodev mount options to /tmp.
#
# Mode = noexec  — exec(2) on any /tmp file returns EACCES
# Mode = nosuid  — SUID bit ignored on /tmp files
# Mode = nodev   — device nodes on /tmp ignored (no /tmp/mydev)
#
# Effect: an attacker who lands a shell script in /tmp can't
# directly execute it. They must copy elsewhere or pipe through
# bash -c (caught by audit-rules execve watch).

[Mount]
Options=mode=1777,strictatime,nosuid,nodev,noexec
