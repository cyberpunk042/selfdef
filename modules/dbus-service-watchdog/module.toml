name        = "dbus-service-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the admin/local D-Bus system activation services + policy files (/usr/local/share/dbus-1/system-services/*.service + /etc/dbus-1/system-services + /etc/dbus-1/system.d/*.conf + /usr/local/share/dbus-1/system.d) vs a learned baseline + ownership + Exec/User + policy scan. A D-Bus-activated system service runs its Exec= as the configured User (often root) when any client calls its bus name; a rogue activation file is root-exec-on-demand persistence, and a permissive policy `<allow own=>` lets an attacker hijack a privileged bus name (T1543/T1548). The admin/local dirs are sparse, so a new activation service is high-signal. /usr/share (package-managed) not watched"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["dbus-service-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any dbus-service change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/dbus-service-watchdog.toml",
    "/usr/local/libexec/selfdef/dbus-service-watchdog.sh",
    "/etc/systemd/system/selfdef-dbus-service.service",
    "/etc/systemd/system/selfdef-dbus-service.timer",
    "/var/lib/selfdef/dbus-service-baseline.tsv",
]
