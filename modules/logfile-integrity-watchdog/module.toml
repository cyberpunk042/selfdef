name        = "logfile-integrity-watchdog"
version     = "0.1.0"
summary     = "Detect log-tampering by tracking monotonic growth of critical logs (wtmp, btmp, lastlog, auth.log, secure, journal). A log that SHRANK or whose inode changed between scans is the indicator-removal signature — an attacker truncating /var/log/wtmp to erase their login (T1070.002 / T1070.006)"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["logfile-integrity-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "stat" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log findings; exit 0
# `enforce`          — exit 1 on any shrink/inode-change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/logfile-integrity-watchdog.toml",
    "/usr/local/libexec/selfdef/logfile-integrity-watchdog.sh",
    "/etc/systemd/system/selfdef-logfile-integrity.service",
    "/etc/systemd/system/selfdef-logfile-integrity.timer",
    "/var/lib/selfdef/logfile-integrity-state.tsv",
]
