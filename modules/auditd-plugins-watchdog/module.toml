name        = "auditd-plugins-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the auditd dispatcher-plugin configs (/etc/audit/plugins.d/*.conf and legacy /etc/audisp/plugins.d/*.conf) vs a learned baseline + ownership + plugin-path scan. auditd launches each active plugin's `path =` program AS ROOT and feeds it the live audit event stream — so a planted plugin (active = yes, path = /tmp/evil) is root-exec persistence driven by audit activity (T1546), and it sits inside the audit pipeline where it can also suppress/tamper with the very events that would reveal it (T1562.001 impair defenses). Distinct from audit-config-watchdog (auditd.conf + audit.rules content): this is the audit dispatcher-plugin exec surface. A plugin path under /tmp /home /dev/shm /var/tmp or relative-with-slash, a world-writable/non-root .conf, or any added active plugin is the signature. No-ops cleanly when auditd plugins.d is absent"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["auditd-plugins-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any auditd plugin change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/auditd-plugins-watchdog.toml",
    "/usr/local/libexec/selfdef/auditd-plugins-watchdog.sh",
    "/etc/systemd/system/selfdef-audit-plugins.service",
    "/etc/systemd/system/selfdef-audit-plugins.timer",
    "/var/lib/selfdef/auditd-plugins-baseline.tsv",
]
