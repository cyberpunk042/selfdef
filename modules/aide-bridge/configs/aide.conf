# selfdef aide-bridge — AIDE configuration drop-in.
#
# Composed by aide(1) with /etc/aide/aide.conf at run time. The
# OS-shipped default usually watches /etc, /boot, /bin, /sbin,
# /usr/bin, /usr/sbin; we ADD coverage for:
#  - /opt (operator-installed tools)
#  - /srv (operator-served content)
#  - /usr/local (compiled-from-source tools)
#  - /lib/modules (kernel modules — pairs with kernel-lockdown
#    strict mode's modules_disabled detection)
#  - selfdef's own dirs (so an attacker can't quietly modify
#    selfdef itself without an AIDE diff)
#
# Excludes:
#  - /var/log (legitimately mutates constantly)
#  - /var/lib/selfdef/{bus,store,coredumps,audit-state,…}
#    (legitimately mutates; selfdef-collector-eventstream and
#    selfdef-store own integrity)
#  - /home (operator's working files; not selfdef's concern)
#  - /tmp /var/tmp /var/cache (transient)

# === Permission/hash rule sets ===
# NORMAL = perms + owner + group + xattrs + sha256 hash. Strongest
# for binaries + config files.
NORMAL = R+sha256+xattrs
# DIR = directory permission + ownership only (don't hash dir
# entries; their content is the children).
DIR = p+u+g+xattrs
# LOG = file existed, but content rotates — track permission only.
LOG = p+u+g

# === selfdef-curated watch set ===
/etc           NORMAL
/boot          NORMAL
/bin           NORMAL
/sbin          NORMAL
/usr/bin       NORMAL
/usr/sbin      NORMAL
/usr/local/bin NORMAL
/usr/local/sbin NORMAL
/usr/local/libexec/selfdef NORMAL
/opt           NORMAL
/srv           DIR
/lib/modules   NORMAL

# selfdef's own static dirs (binaries + module sources). Operator
# may add more under /etc/selfdef/aide.local to extend.
/etc/selfdef/modules    NORMAL

# === Excludes ===
# (AIDE syntax: `!path` excludes; LATER excludes override earlier
# includes at the same prefix.)
!/var/log
!/var/lib/selfdef
!/var/lib/aide/aide.db
!/var/lib/aide/aide.db.new
!/home
!/root
!/tmp
!/var/tmp
!/var/cache
!/run
!/proc
!/sys
!/dev
