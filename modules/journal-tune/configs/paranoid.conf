# selfdef journal-tune — paranoid profile.
#
# Sized for hosts running audit-rules `paranoid` + multiple high-
# volume AI tool processes that journal-log heavily.
# Disables ratelimit entirely + 4 GiB persistent retention.

[Journal]
Storage=persistent
Compress=yes

# === Retention sizing — much larger ===
SystemMaxUse=4G
SystemKeepFree=2G
SystemMaxFileSize=200M
SystemMaxFiles=20
MaxRetentionSec=90day

# === Disable ratelimit entirely ===
# RateLimitBurst=0 means "unlimited". Operator accepts that a
# misbehaving service can fill the journal — the value of seeing
# everything outweighs the risk on a high-assurance host.
RateLimitIntervalSec=0
RateLimitBurst=0

# === Larger line cap ===
LineMax=512K

ForwardToSyslog=no
ForwardToWall=no
MaxLevelStore=debug
MaxLevelSyslog=info
