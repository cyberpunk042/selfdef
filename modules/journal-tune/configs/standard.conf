# selfdef journal-tune — standard profile.
#
# Tuned for the daily-cadence detection module event rate
# (aide-bridge + rkhunter-cron + lynis-cron each emit O(10-100)
# selfdef-* tagged events per run; chronyc/time-skew adds
# ~288 events/day at 5min cadence).
#
# Composed by systemd-journald with the OS-shipped
# /etc/systemd/journald.conf at daemon start. Operator-tuned
# overrides land at 60-…, 70-…, 99-… (lex-order later → overrides).

[Journal]
# Persistent storage — events survive reboot. Default is `auto`
# which uses /var/log/journal only if it exists; we force `persistent`
# so the journal is a reliable history.
Storage=persistent

# Compress entries with zstd (default in recent systemd).
Compress=yes

# === Retention sizing ===
# 500 MiB total persistent journal + always keep 1 GiB free on /var.
# 30-day retention horizon (older entries auto-drop). Adjusted from
# default ~10% of /var which can balloon on a workstation.
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=50M
SystemMaxFiles=20
MaxRetentionSec=30day

# === Per-service ratelimit ===
# Default is 10000 messages per 30s per service. AIDE diff bursts
# can exceed that easily (one selfdef-aide-detail line per
# changed file). Bump to 30000 / 30s so a legitimate burst
# doesn't get suppressed.
RateLimitIntervalSec=30s
RateLimitBurst=30000

# === Line size ===
# Default 48 KiB caps the JSON payloads we emit. Bump to 256 KiB
# so a full structured event with long sample[] arrays fits.
LineMax=256K

# === Forward to syslog ===
# Default forwards everything; if rsyslog/syslog-ng is installed
# that's duplication. selfdef-collector-journald reads directly
# from the journal — no syslog hop needed.
ForwardToSyslog=no
ForwardToWall=no

# === Log level cap for persistent storage ===
# debug-level logging fills the journal; cap at info for storage
# while keeping kmsg + console at default for live triage.
MaxLevelStore=info
MaxLevelSyslog=info
