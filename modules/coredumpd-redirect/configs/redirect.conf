# selfdef coredumpd-redirect — redirect profile.
#
# systemd-coredump drop-in. Redirects coredump storage to a
# selfdef-owned dir with strict permissions so:
#  - operator can preserve coredumps for forensic analysis
#  - non-root processes CANNOT read coredumps (no SUID secret leak)
#  - dir lives under /var/lib/selfdef/ (selfdef-managed mount
#    boundary, alongside store + audit + bus state)
#
# Composed by systemd with /etc/systemd/coredump.conf at unit start.

[Coredump]
# Where to write coredumps. systemd-coredump creates the file
# OWNED BY THE PROCESS UID at this path UNLESS the dir lacks
# group/other write — which is the entire point of this redirect.
Storage=external

# Disable compression so forensic tools (gdb, eu-readelf) can read
# without xz-decompressing first. Cost: more disk; benefit: faster
# triage. Operator can flip to "yes" via a sibling drop-in if disk
# matters more than triage speed.
Compress=no

# Limits — match systemd defaults except ProcessSizeMax (we lift
# it to 4 GiB for AI workstation processes that may legitimately
# hold large models in RSS).
ProcessSizeMax=4G
ExternalSizeMax=4G

# Keep coredumps for 30 days (default 3); enables incident-response
# triage across multi-week investigation windows.
MaxUse=20G
KeepFree=10G
