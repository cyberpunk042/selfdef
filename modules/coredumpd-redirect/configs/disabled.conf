# selfdef coredumpd-redirect — disabled profile.
#
# Storage=none — systemd-coredump receives + logs the dump
# metadata but writes NO actual core file to disk. Operator
# explicitly opts out of preservation.
#
# Use when: disk is constrained, or operator is paranoid about
# any forensic artifact retention at all. Crash metadata (pid,
# exe, signal) still goes to the journal.

[Coredump]
Storage=none
