name        = "pm-utils-hooks-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the pm-utils power-event hook dirs (/etc/pm/sleep.d, /etc/pm/power.d, /etc/pm/config.d) vs a learned baseline + ownership + suspicious-pattern scan. pm-action / pm-powersave run every script in sleep.d AS ROOT around suspend/hibernate/thaw/resume and every script in power.d AS ROOT on AC<->battery transition. A dropped script self-triggers on routine power activity (lid, AC plug, idle suspend) without operator action (T1546). pm-utils is a THIRD power-event mechanism independent of systemd-logind and acpid, so this is distinct from systemd-power-hooks-watchdog (systemd system-sleep/system-shutdown) and acpi-hooks-watchdog (acpid events/actions); on hosts running pm-utils those two do not see this surface. A script under /tmp /home /dev/shm, world-writable, non-root, or an injection pattern is the signature. No-ops cleanly when pm-utils is not installed"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["pm-utils-hooks-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any pm-utils hook change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/pm-utils-hooks-watchdog.toml",
    "/usr/local/libexec/selfdef/pm-utils-hooks-watchdog.sh",
    "/etc/systemd/system/selfdef-pm-utils.service",
    "/etc/systemd/system/selfdef-pm-utils.timer",
    "/var/lib/selfdef/pm-utils-hooks-baseline.tsv",
]
