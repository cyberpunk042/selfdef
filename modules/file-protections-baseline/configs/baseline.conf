# selfdef file-protections-baseline — baseline profile.
# All 4 fs.protected_* sysctls ON.

# Disallow hardlink creation to a file the user does not own,
# unless: (a) the user owns the file, OR (b) the user has
# read+write access to the file. Defeats the classic
# /tmp-race-then-hardlink-to-root-owned-file exploit.
fs.protected_hardlinks = 1

# Disallow symlink-following in world-writable sticky-bit
# directories unless the symlink's UID matches the
# follower's UID. Defeats /tmp symlink-race exploits
# (attacker drops a symlink in /tmp pointing to /etc/shadow,
# tricks a root-owned process into following it).
fs.protected_symlinks = 1

# Disallow opening FIFOs that don't belong to the user in
# world-writable sticky directories. Same threat model as
# symlinks but with named pipes.
fs.protected_fifos = 2

# Disallow opening regular files that don't belong to the
# user in world-writable sticky directories. Most aggressive
# of the four; defeats race-and-replace in /tmp.
fs.protected_regular = 2
