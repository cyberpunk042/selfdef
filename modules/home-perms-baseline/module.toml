name        = "home-perms-baseline"
version     = "0.1.0"
summary     = "Tighten home-directory permissions — chmod each /home/<user> to 0750 (group profile) or 0700 (strict) so other local users can't browse a user's files. Default distro 0755 leaves home dirs world-readable. Idempotent + skips operator-prefixed + system accounts. CIS 6.2.x"
category    = "hardening"

depends_on  = []
conflicts   = []
provides    = ["home-perms-baseline"]
consumes    = []

requires    = []

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `group` (default) — chmod 0750 (owner rwx, group rx, world none)
# `strict`          — chmod 0700 (owner-only)
default = "group"
available = ["group", "strict"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/home-perms-baseline.toml",
    "/var/lib/selfdef/home-perms.bak",
]
