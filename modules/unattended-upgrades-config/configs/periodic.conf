// selfdef unattended-upgrades-config — apt periodic schedule.
//
// Installed at /etc/apt/apt.conf.d/20selfdef-periodic. Enables
// the apt.systemd.daily timer that DRIVES unattended-upgrade.
//
// Without these flags set to "1", the OS-installed unattended-
// upgrades package can be PRESENT but DORMANT (the timer never
// runs). This drop-in turns it on.

APT::Periodic::Enable "1";
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Download-Upgradeable-Packages "1";
APT::Periodic::AutocleanInterval "7";
APT::Periodic::Unattended-Upgrade "1";
