// selfdef unattended-upgrades-config — security-only profile.
//
// Installed at /etc/apt/apt.conf.d/50selfdef-unattended-upgrades.
// Composes with the OS-shipped /etc/apt/apt.conf.d/50unattended-
// upgrades at apt.systemd.daily run time. Later-named drop-ins
// (60-, 70-, ..., 99-) override OURS — operator can layer hand-
// edits on top.

// === Origins-Pattern: limit to security pockets ONLY ===
// Apt's "Origins-Pattern" syntax tags Debian/Ubuntu/CentOS by
// origin + suite. Security pockets carry CVE patches; non-security
// pockets carry feature releases.
Unattended-Upgrade::Origins-Pattern {
    "origin=Debian,codename=${distro_codename},label=Debian-Security";
    "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
    "origin=Ubuntu,codename=${distro_codename},archive=${distro_codename}-security";
    "origin=Ubuntu,codename=${distro_codename}-security";
};

// === Auto-reboot — DISABLED by default (security-only profile) ===
// The security-and-reboot profile flips this to true.
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
Unattended-Upgrade::Automatic-Reboot-Time "02:00";

// === Email — DISABLED. selfdef-notifier-engine + auditd
//     collector handle the operator-notify surface; we don't want
//     apt's own mail flow to fight with that. ===
Unattended-Upgrade::Mail "";

// === Conservative behaviors ===
// Don't auto-fix dpkg-interrupted state — that's an operator-
// inspect-and-decide situation.
Unattended-Upgrade::AutoFixInterruptedDpkg "false";
// Run in foreground so the systemd unit knows when it's done.
Unattended-Upgrade::MinimalSteps "true";
// Drop the unattended-upgrade log per-day, keep 30 days.
Unattended-Upgrade::SyslogEnable "true";
Unattended-Upgrade::SyslogFacility "daemon";

// === Package-blacklist — operator-extensible ===
// Operator can append to /etc/apt/apt.conf.d/60operator-uu-blacklist
// (later-named, overrides OURS). The shipped list is empty.
Unattended-Upgrade::Package-Blacklist {
};

// === Keep package downloads on disk so a failed install can
//     resume without re-downloading. ===
Unattended-Upgrade::Keep-Downloads "true";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
