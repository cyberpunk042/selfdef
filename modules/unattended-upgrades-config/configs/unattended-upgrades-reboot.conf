// selfdef unattended-upgrades-config — security-and-reboot profile
// override layer.
//
// Installed at /etc/apt/apt.conf.d/60selfdef-unattended-reboot
// (numbered higher than 50selfdef-unattended-upgrades so it
// overrides). Operator-pull: explicit opt-in to auto-reboot.

Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
Unattended-Upgrade::Automatic-Reboot-Time "02:00";
