# selfdef rare-network-protocols-disable — baseline.
# CIS 3.4 protocol set.

# DCCP — Datagram Congestion Control Protocol. Rarely used;
# parser CVEs occasionally drop (CVE-2017-6074 use-after-
# free).
install dccp        /bin/true
blacklist dccp

# SCTP — Stream Control Transmission Protocol. Used by some
# telco (SIGTRAN) but rarely on general-purpose hosts.
# Multiple memory CVEs over the years.
install sctp        /bin/true
blacklist sctp

# RDS — Reliable Datagram Sockets. Used inside Oracle stack;
# rare elsewhere. CVE-2010-3904 priv-esc via RDS_PAGE_REMAINDER.
install rds         /bin/true
blacklist rds

# TIPC — Transparent Inter-Process Communication. Used in
# carrier-grade Linux; rare on general hosts. CVE-2021-43267
# heap-overflow in MSG_CRYPTO type.
install tipc        /bin/true
blacklist tipc
