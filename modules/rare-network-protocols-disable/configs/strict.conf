# selfdef rare-network-protocols-disable — strict.
# baseline + legacy protocols (DISA-STIG inspired).

install dccp        /bin/true
blacklist dccp
install sctp        /bin/true
blacklist sctp
install rds         /bin/true
blacklist rds
install tipc        /bin/true
blacklist tipc

# Legacy / niche protocols. None are used on a modern
# general-purpose Linux host in 2026.
install atm         /bin/true
blacklist atm
install can         /bin/true
blacklist can
install appletalk   /bin/true
blacklist appletalk
install decnet      /bin/true
blacklist decnet
install ipx         /bin/true
blacklist ipx
install netrom      /bin/true
blacklist netrom
install ax25        /bin/true
blacklist ax25
install rose        /bin/true
blacklist rose
install x25         /bin/true
blacklist x25
