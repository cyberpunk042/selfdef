# Example module manifest: the existing selfdef daemon as a first-class
# module. This file is the reference implementation of the contract
# defined in docs/src/modules.md.

name        = "detect-host"
version     = "0.1.0"
summary     = "Host self-defense daemon (collectors, correlator, responder, notifier)"
category    = "detection"

depends_on  = []
conflicts   = []

# What this module offers to other modules. Anything that wants a
# place to publish events can declare `consumes = ["event-bus"]`.
provides    = ["event-bus", "finding-store", "sigma-correlator"]
consumes    = []

requires    = [
    { kind = "binary", value = "systemctl" },
]

# The install of this module is the install of the selfdef-daemon
# Debian package — no shell scripts to run.
[install]
kind = "debian-package"
package = "selfdef-daemon"

# No profiles yet — the daemon's behaviour is driven by /etc/selfdef/
# selfdef.toml, which is its own config file outside the module layer
# until M-modules ph.2 folds it in.
[profiles]
default = "default"
available = ["default"]

# MS011 Z-8 / SDD-026 — install-path manifest. `scope = "system"`
# (default sovereignty: writes /etc, /usr, /var). The `paths` list
# enumerates the on-disk surfaces this module touches on apply, used
# by the dashboard's install-options surface + the install-plan
# topological sorter to surface inter-module path conflicts before
# they happen.
[install_paths]
scope = "system"
paths = ["/etc/selfdef", "/var/lib/selfdef", "/etc/systemd/system/selfdef-detect.service"]
