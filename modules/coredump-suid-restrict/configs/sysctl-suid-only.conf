# selfdef coredump-suid-restrict — suid-only.
# fs.suid_dumpable=0: a process that changed its credentials
# (setuid/setgid) is NOT dumpable. The kernel default on many
# distros is 0 already, but distro hardening varies; this
# guarantees it.
#   0 = setuid processes never dump (SECURE)
#   1 = setuid processes dump readable-by-anyone (INSECURE)
#   2 = setuid processes dump readable-by-root-only (compromise)
fs.suid_dumpable = 0
