# Profile: strict (default).
#
# Drift is fatal — `selfdefctl modules apply` and `check` both exit
# non-zero when any baselined file has changed, is missing, or when a
# previously-unseen file matches the configured globs.

profile = "strict"

# File listing the absolute paths (or globs) to baseline. One per
# line; blank lines and `#`-comments allowed.
paths_file = "/etc/selfdef/integrity-sentinel/paths.txt"

# Where the recorded SHA256 baseline lives. Operator-managed at 0600
# (selfdef does not chmod it). `sha256sum`-format so the file is
# directly verifiable with `sha256sum -c <baseline_path>`.
baseline_path = "/var/lib/selfdef/integrity-sentinel/baseline.sha256"

# What to do on the first apply, when no baseline exists yet:
#   "create"  — create one (first-run friendly; the operator just runs apply).
#   "fail"    — refuse to run. Use this once you've sealed an
#               initial baseline out-of-band and never want apply to
#               silently re-baseline.
on_missing = "create"

# Optional: when drift is detected, append a Detection Finding (OCSF
# class 2004) to this JSONL stream. The selfdef daemon's
# `eventstream` collector tails it and republishes onto the bus so
# the existing notifier chain (ntfy / Signal) fires. Leave the key
# unset to suppress eventstream emission entirely (the structured
# `modules check` status still surfaces the drift).
#
# event_stream_path     = "/var/lib/selfdef/eventstream/integrity-sentinel.jsonl"
# event_severity_strict = "high"   # severity attached to strict drift events
