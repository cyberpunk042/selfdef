# Profile: warn-only.
#
# Same paths_file / baseline_path semantics as `strict`, but drift is
# reported as `ok` with a "DRIFT" prefix in the status message — apply
# and check stay green so other modules continue to run. Use during
# bring-up while you stabilize what's in the baseline; flip to
# `strict` once the noise is gone.

profile = "warn-only"

paths_file    = "/etc/selfdef/integrity-sentinel/paths.txt"
baseline_path = "/var/lib/selfdef/integrity-sentinel/baseline.sha256"
on_missing    = "create"

# Optional: append a Detection Finding to this JSONL stream when
# drift is detected. See the strict profile for the full contract.
# warn-only drift defaults to severity `low` so it doesn't trip the
# `is_actionable` filter on its own — flip to strict once the noise
# is gone.
#
# event_stream_path   = "/var/lib/selfdef/eventstream/integrity-sentinel.jsonl"
# event_severity_warn = "low"
