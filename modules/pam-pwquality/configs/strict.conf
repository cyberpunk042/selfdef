# selfdef pam-pwquality — strict profile.

minlen = 16
minclass = 4
dcredit = -1
ucredit = -1
lcredit = -1
ocredit = -1
difok = 6
retry = 3
reject_username = true
enforce_for_root = true
gecoscheck = true

# === Dictionary word check ===
# pam_pwquality uses cracklib's dictionary if
# /usr/share/cracklib/* is installed. Operator installs the
# `libpam-cracklib` (Debian) or `cracklib-dicts` (RHEL) package
# for this to take effect.
dictpath = /usr/share/cracklib
