# selfdef pam-pwquality — standard profile.
#
# Drops at /etc/security/pwquality.conf.d/50-selfdef.conf.
# pam_pwquality.so reads /etc/security/pwquality.conf + every
# *.conf in /etc/security/pwquality.conf.d/ at password-set
# time.

# === Minimum length ===
minlen = 12

# === Character-class diversity ===
# pwquality credits negative numbers as "require at least N of
# this class". -1 means "require at least 1".
# dcredit = digit; ucredit = uppercase; lcredit = lowercase;
# ocredit = other (symbols).
# minclass=3 means "at least 3 of the 4 classes must appear".
minclass = 3
dcredit  = -1
ucredit  = -1
lcredit  = -1
ocredit  = 0

# === Difference from old password ===
# At least 4 characters must differ from the previous password.
difok = 4

# === Retry count ===
# Operator gets 3 attempts to satisfy the policy per passwd
# invocation before pam_pwquality fails the session.
retry = 3

# === Reject username + dictionary words ===
# rejects "operator" or "operator123" if username is "operator".
reject_username = true

# === Don't enforce for root ===
# Root can set anything (operator may need to bypass policy in
# recovery). Strict profile flips this.
enforce_for_root = false

# === No "password is too similar to old" check beyond difok ===
# difok handles literal char-position diff; we don't want the
# pwquality Levenshtein-like check (gimmickrootkit / 'fuzzy
# similarity') which often blocks legitimate operator-chosen
# distinct passwords.
gecoscheck = true
