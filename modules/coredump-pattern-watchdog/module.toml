name        = "coredump-pattern-watchdog"
version     = "0.1.0"
summary     = "Boot + daily verification that kernel.core_pattern has not been hijacked to pipe core dumps to an attacker program. A core_pattern of |/tmp/evil runs that program AS ROOT on the next crash of any process — a stealthy privilege-escalation + persistence primitive (T1546 / T1574). Allowlists systemd-coredump + apport + plain 'core'"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["coredump-pattern-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log findings; exit 0
# `enforce`          — exit 1 if core_pattern pipes to a
#                     non-allowlisted program
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/coredump-pattern-watchdog.toml",
    "/usr/local/libexec/selfdef/coredump-pattern-watchdog.sh",
    "/etc/systemd/system/selfdef-coredump-pattern.service",
    "/etc/systemd/system/selfdef-coredump-pattern.timer",
]
