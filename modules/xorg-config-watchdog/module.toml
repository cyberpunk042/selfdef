name        = "xorg-config-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the X server config (/etc/X11/xorg.conf, /etc/X11/xorg.conf.d/*.conf) vs a learned baseline + ownership + ModulePath/Load scan. On non-rootless setups the X server runs AS ROOT and loads modules (.so) from the Section Files ModulePath and the Section Module Load directives — so a planted config with a ModulePath under a writable/attacker location loads attacker code into the root X server at the next server start (T1574 hijack execution flow / T1547). Distinct from xsession-watchdog (user-context session scripts) and display-manager-hooks-watchdog (DM root login scripts): this is the X-server module-load surface. A ModulePath under /tmp /home /dev/shm /var/tmp or relative, a world-writable/non-root .conf, or any added config is the signature. No-ops cleanly on headless hosts / no X config"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["xorg-config-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any X server config change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/xorg-config-watchdog.toml",
    "/usr/local/libexec/selfdef/xorg-config-watchdog.sh",
    "/etc/systemd/system/selfdef-xorg-config.service",
    "/etc/systemd/system/selfdef-xorg-config.timer",
    "/var/lib/selfdef/xorg-config-baseline.tsv",
]
