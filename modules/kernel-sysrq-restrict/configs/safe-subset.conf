# selfdef kernel-sysrq-restrict — safe-subset.
# Bitmask 132 = 4 (enable console log level) + 128 (reboot +
# poweroff). Operator at the local console can still do an
# emergency reboot of a hung system (raise-elephants-skip-
# umount-shutdown sequence partial), but loses sync / dump /
# nice / kill-all / OOM-trigger primitives.
#
# Full bitmask reference:
#   1   = enable control of console log level
#   2   = enable control of keyboard (SAK + raw)
#   4   = enable control of console log + magic sysrq enable
#   8   = enable debugging dumps of processes etc.
#   16  = enable sync command
#   32  = enable remount read-only
#   64  = enable signaling of processes
#   128 = allow reboot/poweroff
#   256 = allow nicing all RT tasks
kernel.sysrq = 132
