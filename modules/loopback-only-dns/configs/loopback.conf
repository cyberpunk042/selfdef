# selfdef loopback-only-dns — loopback profile.
#
# Drops at /etc/systemd/resolved.conf.d/50-selfdef-loopback.conf.
# Composed by systemd-resolved with /etc/systemd/resolved.conf
# at daemon start.

[Resolve]
# Bind the stub listener to loopback only. The listener address
# is 127.0.0.53 by default (systemd-resolved standard) — not
# operator-tunable via .conf, but ALWAYS loopback-only.
DNSStubListener=yes

# Disable LLMNR + mDNS (link-local multicast resolution). Both
# are network-side probes for /etc/hostname; an attacker on the
# same L2 can spoof responses (responder.py, etc.).
LLMNR=no
MulticastDNS=no

# Disable DNSSEC enforcement override (let the upstream resolver
# decide). Default is allow-downgrade — operator picks per-host
# via a 60-operator drop-in if they want strict.
DNSSEC=allow-downgrade

# Cache results — reduces upstream queries; bounded by
# systemd-resolved's own cache eviction.
Cache=yes

# DNS over TLS (opportunistic). When upstream supports DoT,
# uses it. Operator who runs a local unbound + wants DoT-strict
# overrides via a 60-operator drop-in.
DNSOverTLS=opportunistic

# Read-only domains list — restrict the LOCALDOMAIN resolution
# scope to truly-local. Operator-extension goes in
# /etc/systemd/resolved.conf.d/60-operator-domains.conf.
Domains=~.

# FallbackDNS: empty so systemd-resolved doesn't silently use
# Google/Cloudflare without operator-pull configuration. Forces
# the operator to set Upstream DNS explicitly via the OS-shipped
# /etc/systemd/resolved.conf OR a 60-operator-upstream.conf
# drop-in.
FallbackDNS=
