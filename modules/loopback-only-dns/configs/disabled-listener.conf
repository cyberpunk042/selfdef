# selfdef loopback-only-dns — disabled-listener profile.
#
# Turns off systemd-resolved's stub listener entirely. Operator
# uses /etc/resolv.conf upstream-DNS pointers directly OR runs
# their own local unbound/dnsmasq on 127.0.0.1:53.
#
# Use on hosts where systemd-resolved is not the canonical
# resolver (operator runs unbound or pi-hole locally).

[Resolve]
DNSStubListener=no
LLMNR=no
MulticastDNS=no
DNSSEC=allow-downgrade
Cache=yes
DNSOverTLS=opportunistic
Domains=~.
FallbackDNS=
