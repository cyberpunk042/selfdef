# selfdef chrony-baseline — NTS profile.
#
# Network Time Security (NTS, RFC 8915) authenticated NTP. Each
# packet is HMAC-signed so a network attacker can't return forged
# time. Slower than plain NTP (TLS handshake on cookie refresh)
# but cryptographically auditable.
#
# Requires chrony >= 4.0.

# === NTS-authenticated time sources ===
server time.cloudflare.com iburst nts
server nts.netnod.se        iburst nts
server ptbtime1.ptb.de      iburst nts
server time.nl              iburst nts

# === Same sanity, drift, logging, maxchange as pool profile ===
makestep 5.0 3
driftfile /var/lib/chrony/drift
cmdallow 127.0.0.1
cmdallow ::1
log tracking measurements statistics
logdir /var/log/chrony
maxchange 3600 1 0

# === NTS cookie storage ===
ntsdumpdir /var/lib/chrony

# === Force NTS-only — refuse plain NTP fallback ===
authselectmode require
