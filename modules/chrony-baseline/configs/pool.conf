# selfdef chrony-baseline — pool profile.
#
# Multi-pool NTP configuration with diverse fallbacks. Standard
# pool.ntp.org rotates through hundreds of community servers;
# cloudflare's time.cloudflare.com + Google's time.google.com
# provide commercial-uptime fallbacks. iburst speeds the initial
# 4-packet handshake.
#
# Installed at /etc/chrony/conf.d/50-selfdef.conf — composed with
# the OS-shipped /etc/chrony/chrony.conf at chronyd startup.

# === Multi-source pools ===
pool 2.pool.ntp.org    iburst maxsources 4
pool time.cloudflare.com iburst maxsources 2
pool time.google.com    iburst maxsources 2

# === Sanity: reject sources that would jump the clock more than 5s
#      after the first probe ===
makestep 5.0 3

# === Drift file — chrony writes the measured drift here ===
driftfile /var/lib/chrony/drift

# === Allow chronyc only from localhost ===
cmdallow 127.0.0.1
cmdallow ::1

# === Logging — chrony writes tracking + measurements to journal.
#      selfdef-collector-journald ingests these alongside other
#      system events. ===
log tracking measurements statistics
logdir /var/log/chrony

# === Refuse to step the clock more than 1 hour ===
# If the measured offset exceeds this, chrony LOGS but does not
# step (operator must intervene manually). Protects against
# malicious NTP server returning a wildly-wrong time.
maxchange 3600 1 0

# === DNSSEC for pool resolution (when systemd-resolved is the
#      stub) — not chrony's responsibility but documented here ===
# (no-op chrony directive)
