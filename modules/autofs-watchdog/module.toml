name        = "autofs-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the autofs master maps (/etc/auto.master, /etc/auto.master.d/*.autofs) vs a learned baseline + ownership + program-map scan. autofs runs a `program:` map (or any executable map file) AS ROOT to generate mount entries when the corresponding autofs mountpoint is accessed — so a planted `program:/tmp/x` master entry, or an executable map file under a writable location, is mount-access-triggered root code execution (T1546), fired on demand by anyone who can stat/cd the mountpoint. This is the mount-access exec trigger class — distinct from cron/incron/at (time/file-event), the login/network/power/boot watchdogs, and snmpd/mail (query/mail). A program-map path under /tmp /home /dev/shm /var/tmp, an executable map file in a writable location, a world-writable/non-root master map, or any added program map is the signature. No-ops cleanly when autofs is not configured"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["autofs-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any autofs map change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/autofs-watchdog.toml",
    "/usr/local/libexec/selfdef/autofs-watchdog.sh",
    "/etc/systemd/system/selfdef-autofs.service",
    "/etc/systemd/system/selfdef-autofs.timer",
    "/var/lib/selfdef/autofs-baseline.tsv",
]
