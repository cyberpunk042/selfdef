# Profile: audit (default).
#
# All policies installed with `action: Post`. Tetragon emits events
# for every match; nothing is killed. This is the right starting
# point — flip to `enforce` once the baseline is quiet and you've
# tuned the egress allowlist.

profile = "audit"

# Container scope. `container` (default) uses Tetragon's
# `matchNamespaces` selector to match any process whose PID
# namespace differs from the host's — works on every container
# runtime (Docker / Podman / containerd standalone / k8s). Switch
# to `pod-label` on Kubernetes hosts to scope to a specific pod
# label instead.
scope = "container"
# Only used when scope = "pod-label":
pod_label_key   = "selfdef.io/agent"
pod_label_value = "true"

# Each policy in the bundle can be independently enabled and have
# its own action override. The default action (Post in `audit`,
# Sigkill in `enforce`) is used when the per-policy override is
# absent or "default".

# Block writes anywhere under /etc/ from inside containers.
etc_write_enabled = true
etc_write_action  = "default"

# Block execve of bash/sh/dash/zsh/ash from inside containers.
shell_exec_enabled = true
shell_exec_action  = "default"

# Block egress to non-allowlisted CIDRs from inside containers.
# `egress_allowlist` is comma-separated CIDRs. An empty allowlist
# in `audit` mode still emits events but never kills.
egress_enabled   = true
egress_action    = "default"
egress_allowlist = ""

# Forward-looking SecureMessage endpoint guard. Leave the endpoint
# unset until the host actually has one — the policy stub stays
# dormant.
securemessage_enabled  = true
securemessage_action   = "default"
securemessage_endpoint = ""

# GPU device guard. Watches `security_file_open` against device
# nodes that AI workloads typically need (`/dev/nvidia*` by default;
# extend via `gpu_device_paths` for AMD ROCm, Intel Habana, etc.).
# `gpu_device_allowlist` is the CSV of in-container binary paths
# permitted to open those devices — leave empty and any container
# touching a GPU device fires the policy. Audit-mode shipping
# default: emit events, don't kill.
gpu_device_enabled   = true
gpu_device_action    = "default"
gpu_device_paths     = ""
gpu_device_allowlist = ""
