# Profile: enforce.
#
# All policies installed with `action: Sigkill` by default. Tetragon
# kills the offending process the moment a match fires. Use only
# after a stable run in `audit` mode — false positives become SIGKILLs.
#
# The SecureMessage policy stays at `Post` even in `enforce` until
# `securemessage_endpoint` is set; the stub default would otherwise
# be a confusing nop-killer.

profile = "enforce"

# Container scope. See profiles/audit.toml for the explanation of
# `container` vs `pod-label`.
scope = "container"
pod_label_key   = "selfdef.io/agent"
pod_label_value = "true"

etc_write_enabled = true
etc_write_action  = "default"   # → Sigkill

shell_exec_enabled = true
shell_exec_action  = "default"  # → Sigkill

egress_enabled   = true
egress_action    = "default"    # → Sigkill
# Comma-separated CIDRs. Typical: your model API + an internal
# SecureMessage endpoint. Empty list with enforce = nothing escapes
# the container, which will be loud — start in audit, populate this,
# then flip to enforce.
egress_allowlist = ""

securemessage_enabled  = true
securemessage_action   = "post"  # stays Post until endpoint is set
securemessage_endpoint = ""

# GPU device guard. enforce default = Sigkill on every in-container
# open of a tracked device node by a binary outside the allowlist.
# An empty `gpu_device_allowlist` with enforce mode means "kill
# every container that touches a GPU device" — populate it (e.g.
# "/usr/local/bin/python3,/usr/bin/torchrun") before flipping to
# enforce.
gpu_device_enabled   = true
gpu_device_action    = "default"
gpu_device_paths     = ""
gpu_device_allowlist = ""
