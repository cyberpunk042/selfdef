name        = "syslog-ng-exec-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the syslog-ng config (/etc/syslog-ng/syslog-ng.conf + /etc/syslog-ng/conf.d/*) for program() destinations vs a learned baseline + ownership scan. A syslog-ng `destination { program(\"/path\"); }` runs a program AS ROOT fed by matching log messages — the syslog-ng sibling of rsyslog's omprog; a rogue program() is root-exec-on-log-event persistence (T1546). A program under /tmp /home /dev/shm, world-writable, bare/relative, an injection pattern, or a world-writable/non-root config is the signature. No-ops cleanly if absent"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["syslog-ng-exec-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any syslog-ng-exec change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/syslog-ng-exec-watchdog.toml",
    "/usr/local/libexec/selfdef/syslog-ng-exec-watchdog.sh",
    "/etc/systemd/system/selfdef-syslog-ng-exec.service",
    "/etc/systemd/system/selfdef-syslog-ng-exec.timer",
    "/var/lib/selfdef/syslog-ng-exec-baseline.tsv",
]
