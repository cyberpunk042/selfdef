name        = "pkcs11-modules-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the p11-kit PKCS#11 module configs (/etc/pkcs11/modules/*.module) vs a learned baseline + ownership + module-path scan. Every p11-kit consumer (GnuPG/gpgsm, ssh-agent/ssh with PKCS#11, NSS-using browsers, libp11) loads the shared object named in each .module file's `module:` line — so a planted .module with `module: /tmp/evil.so` loads attacker code into a broad set of security-sensitive, often credential-handling processes whenever they enumerate PKCS#11 modules (T1574 hijack execution flow). Distinct from ld-preload-watchdog (LD_PRELOAD/ld.so.preload) and ld-so-conf-watchdog (linker search path): this is the p11-kit module-registration surface. A module: path under /tmp /home /dev/shm /var/tmp or relative, a world-writable/non-root .module, or any added module is the signature. No-ops cleanly when /etc/pkcs11/modules is absent"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["pkcs11-modules-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any PKCS#11 module change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/pkcs11-modules-watchdog.toml",
    "/usr/local/libexec/selfdef/pkcs11-modules-watchdog.sh",
    "/etc/systemd/system/selfdef-pkcs11-modules.service",
    "/etc/systemd/system/selfdef-pkcs11-modules.timer",
    "/var/lib/selfdef/pkcs11-modules-baseline.tsv",
]
