name        = "systemd-unit-watchdog"
version     = "0.1.0"
summary     = "Daily + boot delta of the enabled systemd service/socket unit set + their ExecStart hashes vs a learned baseline. A NEW enabled .service (or a CHANGED ExecStart on an existing one) is T1543.002 systemd-service persistence — distinct from cron-job-watchdog (which covers timers only)"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["systemd-unit-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "systemctl" },
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any ADDED/CHANGED unit
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/systemd-unit-watchdog.toml",
    "/usr/local/libexec/selfdef/systemd-unit-watchdog.sh",
    "/etc/systemd/system/selfdef-systemd-units.service",
    "/etc/systemd/system/selfdef-systemd-units.timer",
    "/var/lib/selfdef/systemd-units-baseline.tsv",
]
