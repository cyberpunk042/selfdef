# selfdef usbguard — strict profile.
#
# DENY ALL by default + allow ONLY devices in the operator's
# baseline (concatenated from /etc/selfdef/usbguard/operator-
# baseline.rules at apply time).
#
# The operator MUST generate the baseline FIRST. apply.sh refuses
# to install this profile if the baseline file is missing or empty
# (refuse-to-brick safeguard).
#
# Baseline generation:
#   1. With profile=permissive active, attach every device the
#      operator wants to permanently allow.
#   2. Run: usbguard generate-policy > /etc/selfdef/usbguard/operator-baseline.rules
#   3. Inspect the file — every line should look like
#      `allow id <vendor>:<product> serial "<S>" name "<N>" ...`
#   4. Set profile=strict + re-apply.
#
# This file (strict.conf) is just the TAIL marker. apply.sh
# concatenates operator-baseline.rules BEFORE this tail when
# rendering the final rules.conf.

# Implicit deny-all (USBGuard's default when no matching rule).
# Explicit comment so the operator reading rules.conf sees the
# intent.
# block id *:*
