# selfdef usbguard — permissive profile.
#
# Allow ALL USB devices but EMIT a USBGuard event for each
# attach/detach (audit-only mode). Use to gather a baseline before
# switching to `strict`. The events flow into the auditd / syslog
# pipeline + selfdef's existing collectors pick them up.
#
# NOTHING is denied; the operator never gets locked out of their
# keyboard. The cost is that BadUSB attacks succeed — but the event
# is recorded, so the correlator/notifier surfaces have something to
# alert on.
#
# To upgrade to enforce mode:
#   1. Wait until the audit trail captures all of your legitimate
#      USB devices.
#   2. Run `usbguard generate-policy > /etc/selfdef/usbguard/
#      operator-baseline.rules` (operator-owned baseline).
#   3. Set profile=strict in /etc/selfdef/modules/usbguard.toml
#      and re-apply the module.

# Allow any device, but force USBGuard to log it. `match` rule
# without `id` matches every device; the daemon emits a Policy
# event on each attach.
allow with-interface any
