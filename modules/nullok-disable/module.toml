name        = "nullok-disable"
version     = "0.1.0"
summary     = "Remove `nullok` from pam_unix.so directives in /etc/pam.d/* — blocks empty-password login paths. Mitigates T1078 Valid Accounts (Default Accounts via blank-password edge cases)"
category    = "hardening"

depends_on  = []
conflicts   = []
provides    = ["nullok-removal"]
consumes    = []

requires    = []   # pure file ops

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `audit` (default) — scan /etc/pam.d/* + LOG every nullok found
#                    but DO NOT modify the files. Safe baseline
#                    collection.
# `enforce`         — scan + REMOVE nullok via sed. Backs up
#                    every affected file to .selfdef-nullok-
#                    backup before edit.
default = "audit"
available = ["audit", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/nullok-disable.toml",
]
