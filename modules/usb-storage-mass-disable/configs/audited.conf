# selfdef usb-storage-mass-disable — audited profile.
#
# install <mod> ALSO logs to journald (tag selfdef-usb-storage)
# but THEN loads the module normally. Operator-pull baseline
# visibility into how often usb_storage actually loads on this
# host before flipping to blocked.
#
# `install` script:
#   1. Emit a logger event tagged selfdef-usb-storage
#   2. Call `/sbin/modprobe --ignore-install <mod>` to actually
#      load the module (--ignore-install bypasses recursive
#      install hook to avoid infinite loop)

install usb_storage /bin/sh -c "logger -t selfdef-usb-storage 'usb_storage load attempt'; /sbin/modprobe --ignore-install usb_storage"
install uas         /bin/sh -c "logger -t selfdef-usb-storage 'uas load attempt';         /sbin/modprobe --ignore-install uas"
