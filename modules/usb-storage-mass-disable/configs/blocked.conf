# selfdef usb-storage-mass-disable — blocked profile.
#
# `install <mod> /bin/true` is the canonical modprobe-blacklist
# pattern. When the kernel auto-loads usb_storage on a hotplug
# event, modprobe consults this file + runs /bin/true (which
# succeeds without loading the module). Result: no usb_storage
# device-driver registered → kernel can't bind to inserted USB
# mass-storage devices.
#
# Sibling modules also blocked:
#   - uas (USB Attached SCSI; modern fast-mode USB storage)
#   - vfat (often-used storage FS; blocked at module layer)
#   - cdrom (USB CD/DVD)
#
# Note: vfat blocked here means USB-loaded vfat-formatted media
# won't mount automatically. Operator who needs vfat for non-
# USB cases (EFI System Partition mounting, embedded use) may
# need to override via /etc/modprobe.d/60-operator-fs.conf.

install usb_storage /bin/true
install uas         /bin/true
install vfat        /bin/true
install cdrom       /bin/true

# Also blacklist (defense-in-depth — some kernel auto-load paths
# consult the blacklist before install).
blacklist usb_storage
blacklist uas
blacklist vfat
blacklist cdrom
