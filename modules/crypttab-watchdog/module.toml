name        = "crypttab-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of /etc/crypttab vs a learned baseline + ownership + keyscript/keyfile scan. The crypttab `keyscript=` option runs a program AS ROOT at early boot to obtain the volume key; a rogue keyscript is root-exec-at-boot persistence, and a keyfile under a writable path is key theft (T1037/T1552). A keyscript or keyfile under /tmp /home /dev/shm, world-writable, bare/relative, or a world-writable/non-root crypttab is the signature. Distinct from swap-encryption-detect (verifies swap is encrypted). No-ops cleanly if absent"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["crypttab-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any crypttab change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/crypttab-watchdog.toml",
    "/usr/local/libexec/selfdef/crypttab-watchdog.sh",
    "/etc/systemd/system/selfdef-crypttab.service",
    "/etc/systemd/system/selfdef-crypttab.timer",
    "/var/lib/selfdef/crypttab-baseline.tsv",
]
