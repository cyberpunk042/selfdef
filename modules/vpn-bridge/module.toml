name        = "vpn-bridge"
version     = "0.2.0"
summary     = "Remote-network connectivity: WireGuard relay, Tailscale, or Cloudflare Tunnel"
category    = "network"

depends_on  = []
conflicts   = []

# `overlay-network` is what the peer-to-peer profiles provide.
# `published-tunnel` is what cloudflare-tunnel offers — outbound-only
# L7 publishing. A future module that needs to *reach* peer hosts
# declares `consumes = ["overlay-network"]`; one that needs to
# publish a single service can use either.
provides    = ["overlay-network", "published-tunnel"]
consumes    = []

# Each profile has its own per-profile requirements checked at
# apply-time (so installing the `tailscale` profile doesn't require
# wireguard-tools, and vice versa). The manifest-level requires lists
# only what the dispatcher itself needs.
requires    = [
    { kind = "binary",  value = "systemctl" },
]

# Multi-instance is on, BUT only some profiles support it. Per
# SDD-003: relay-via-server is multi-instance-capable (each
# instance gets its own WireGuard interface, nftables table, and
# wg-quick@<iface>.service). tailscale and cloudflare-tunnel are
# NOT — they each manage a singleton host-wide systemd service
# (`tailscaled.service`, `cloudflared.service`) with a single
# control-plane registration. See [profiles.details.*] below.
instanced = true

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
default = "relay-via-server"
available = ["relay-via-server", "tailscale", "cloudflare-tunnel"]

# SDD-003: per-profile multi-instance capability. The resolver
# refuses `vpn-bridge#<instance>` host keys when the chosen
# profile is `instanced = false`.
[profiles.details.relay-via-server]
instanced = true

[profiles.details.tailscale]
instanced = false

[profiles.details.cloudflare-tunnel]
instanced = false
