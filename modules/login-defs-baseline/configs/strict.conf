# selfdef login-defs-baseline — strict.
# Compliance-regime password aging (PCI DSS 90-day rotation,
# DISA-STIG) + SHA512 with high round count.

PASS_MAX_DAYS 90
PASS_MIN_DAYS 7
PASS_WARN_AGE 14

# SHA512 explicitly (some compliance regimes mandate it by
# name rather than yescrypt, which is newer).
ENCRYPT_METHOD SHA512
SHA_CRYPT_MIN_ROUNDS 65536
SHA_CRYPT_MAX_ROUNDS 65536
