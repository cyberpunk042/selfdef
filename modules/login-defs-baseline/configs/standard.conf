# selfdef login-defs-baseline — standard.
# Password-aging + strong-hash defaults for NEW accounts.
# NIST SP 800-63B v3 deprecates forced rotation, so the
# standard profile uses a generous 365-day max (effectively
# "aging exists but isn't aggressive") + a strong hash.

# Maximum password age (days) before forced change.
PASS_MAX_DAYS 365
# Minimum age (days) — prevents rotate-through-history abuse.
PASS_MIN_DAYS 1
# Warn the operator this many days before expiry.
PASS_WARN_AGE 14

# Password hashing algorithm. yescrypt is the modern default
# (Debian 11+, Fedora 35+); SHA512 is the universal fallback.
ENCRYPT_METHOD YESCRYPT

# SHA512 round count (consulted only when ENCRYPT_METHOD=SHA512).
# Higher = slower to brute-force. 65536 is a strong default.
SHA_CRYPT_MIN_ROUNDS 65536
SHA_CRYPT_MAX_ROUNDS 65536
