name        = "shell-timeout-baseline"
version     = "0.1.0"
summary     = "Auto-logout idle interactive shells via TMOUT (bash/ksh) + autologout (tcsh) in /etc/profile.d. Defends against an unattended operator session being taken over at the keyboard or via a left-open SSH/tmux. CIS 5.4.x. Read-only TMOUT so the operator can't trivially unset it"
category    = "hardening"

depends_on  = []
conflicts   = []
provides    = ["shell-idle-timeout"]
consumes    = []

requires    = []

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `standard` (default) — TMOUT=900 (15 min idle → logout)
# `strict`             — TMOUT=300 (5 min)
default = "standard"
available = ["standard", "strict"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/shell-timeout-baseline.toml",
    "/etc/profile.d/50-selfdef-tmout.sh",
]
