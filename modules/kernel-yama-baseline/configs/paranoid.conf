# selfdef kernel-yama-baseline — paranoid profile.
# ptrace_scope = 3: no process can ptrace any other process,
# regardless of capability. This setting CANNOT be re-enabled
# until reboot — once set to 3, sysctl write to lower values
# returns EINVAL. Operator MUST reboot to relax.
#
# strace / gdb / lldb on already-running processes is dead.
# Starting a new process under gdb still works (it's
# established before ptrace_scope=3 is consulted).
kernel.yama.ptrace_scope = 3
