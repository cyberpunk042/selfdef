name        = "csh-config-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the csh/tcsh global init files (/etc/csh.cshrc, /etc/csh.login, /etc/csh.logout) vs a learned baseline + ownership + suspicious-pattern scan. csh and tcsh source /etc/csh.cshrc on EVERY invocation (interactive or script) and /etc/csh.login at login — so a planted snippet runs in every csh/tcsh session, an interactive-shell persistence vector (T1546). Completes the global interactive-shell-init quartet with shell-init-watchdog (bash/zsh), bash-completion-watchdog (bash completion), and fish-config-watchdog (fish) — csh/tcsh is the remaining shell those do not cover. A snippet under /tmp /home /dev/shm, world-writable, non-root, or an injection pattern is the signature. No-ops cleanly when no csh init files are present"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["csh-config-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any csh init change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/csh-config-watchdog.toml",
    "/usr/local/libexec/selfdef/csh-config-watchdog.sh",
    "/etc/systemd/system/selfdef-csh-config.service",
    "/etc/systemd/system/selfdef-csh-config.timer",
    "/var/lib/selfdef/csh-config-baseline.tsv",
]
