# selfdef auditd-tune — high-volume profile.
#
# Tuned for audit-rules `paranoid` profile event rate
# (~500-5000 events/sec on a busy host — every execve generates
# a SYSCALL+EXECVE pair). Larger log retention, bigger backlog,
# faster flush cadence.
#
# REPLACES /etc/audit/auditd.conf. Original backed up to
# /etc/audit/auditd.conf.selfdef-backup on first apply.

local_events = yes
write_logs = yes
log_file = /var/log/audit/audit.log
log_group = adm
log_format = ENRICHED

# === High-volume flush ===
# NORMAL flush at every record would cripple a paranoid-profile
# host. INCREMENTAL_ASYNC + freq=200 batches 200 records before
# fsync.
flush = INCREMENTAL_ASYNC
freq = 200

# === Larger logs + more rotation ===
max_log_file = 500
num_logs = 20
max_log_file_action = ROTATE

# === Disk-full / disk-error ===
disk_full_action = SUSPEND
disk_error_action = SUSPEND
admin_space_left = 250
admin_space_left_action = SUSPEND
space_left = 500
space_left_action = SYSLOG

# === Lossy dispatch (drop on dispatcher backpressure rather
#     than block the kernel-side path) ===
disp_qos = lossy
dispatcher = /sbin/audispd

tcp_listen_port =
tcp_listen_queue = 5
tcp_max_per_addr = 1
use_libwrap = yes
verify_email = no
action_mail_acct = root
distribute_network = no
end_of_event_timeout = 2
