# selfdef auditd-tune — standard profile.
#
# Tuned for audit-rules `base` profile event rate (~10-50 events/sec
# on a typical workstation). Sufficient buffer + retention without
# burning excessive disk.
#
# Installed at /etc/audit/auditd.conf — REPLACES the OS-shipped
# file (auditd.conf does not honor a conf.d pattern). The operator's
# original is backed up at /etc/audit/auditd.conf.selfdef-backup
# on first apply.

local_events = yes
write_logs = yes

# === Log location + rotation ===
log_file = /var/log/audit/audit.log
log_group = adm
log_format = ENRICHED
flush = INCREMENTAL_ASYNC
freq = 50
max_log_file = 100
num_logs = 10
max_log_file_action = ROTATE

# === Kernel buffer sizing ===
# The kernel queues audit records into a backlog of size
# `kernel.audit_backlog_limit` (default 64). Under load, the
# kernel DROPS records when the backlog fills — silent visibility
# gap. We bump this via auditctl in apply.sh.
# (auditd.conf doesn't carry the kernel knob; we set it via
# auditctl -b at apply time.)

# === Disk-full behavior ===
# When the disk fills, auditd's options are SUSPEND (stop logging
# but keep system running) or HALT (kill the system to prevent
# undetected exec). Operators on detection-only hosts pick
# SUSPEND; high-assurance hosts pick HALT. We default to SUSPEND
# (operator-friendly).
disk_full_action = SUSPEND
disk_error_action = SUSPEND
admin_space_left = 75
admin_space_left_action = SUSPEND
space_left = 100
space_left_action = SYSLOG

# === Lost-record alert ===
# Emit a syslog warning if auditd has dropped any records (== the
# silent visibility gap surfaced).
disp_qos = lossy
dispatcher = /sbin/audispd

# === Network protections (don't accept remote audit) ===
# Hardcoded off — selfdef doesn't use remote audit forwarding.
# Operator wanting it would extend via /etc/selfdef/audit/
# operator-overrides.conf (future).
tcp_listen_port =
tcp_listen_queue = 5
tcp_max_per_addr = 1
use_libwrap = yes

# === Disk-low warnings via SYSLOG (so the journal collector picks
#     them up) ===
verify_email = no
action_mail_acct = root
distribute_network = no
end_of_event_timeout = 2
