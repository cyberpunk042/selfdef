# selfdef dnf-automatic-config — security-only profile.
#
# REPLACES /etc/dnf/automatic.conf entirely (no conf.d for
# dnf-automatic). On first apply the operator's original is
# backed up to /etc/dnf/automatic.conf.selfdef-backup.

[commands]
# Restrict to security advisories ONLY.
upgrade_type = security

# Don't do random version updates outside the security pocket.
random_sleep = 0

# Run the actual download + install + (don't) reboot.
download_updates = yes
apply_updates = yes

# When the kernel updates, NOTE the need-to-reboot but DO NOT
# auto-reboot. Operator schedules.
reboot = never

[emitters]
# selfdef-notifier-engine + journald-collector own the operator-
# notify path. We disable dnf-automatic's own mail emitter.
emit_via = stdio

[command]
command_format = "{command}"
stdin_format = "{body}"

[email]
# Suppressed via emit_via=stdio above; pinning defaults so a
# future profile-switch doesn't inherit weird email-host state.
email_from = root@localhost
email_to = root
email_host = localhost

[base]
debuglevel = 1
