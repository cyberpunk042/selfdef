# selfdef dnf-automatic-config — security-and-reboot profile.
#
# Same as security-only + auto-reboot if a kernel/glibc update
# requires it. Use on unattended servers where guaranteed CVE
# patching outweighs uptime-for-uptime's-sake.

[commands]
upgrade_type = security
random_sleep = 0
download_updates = yes
apply_updates = yes

# Reboot when needed. Default reboot command is `shutdown -r +5`
# which gives operator-pull 5min warning before the reboot fires
# (matters for interactive sessions).
reboot = when-needed
reboot_command = "shutdown -r +5 'Rebooting after dnf-automatic security update'"

[emitters]
emit_via = stdio

[command]
command_format = "{command}"
stdin_format = "{body}"

[email]
email_from = root@localhost
email_to = root
email_host = localhost

[base]
debuglevel = 1
