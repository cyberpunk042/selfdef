name        = "service-account-lock"
version     = "0.1.0"
summary     = "Walk /etc/passwd + lock service accounts (UID < 1000) that have interactive shells. Mitigates T1078.001 (Default Accounts) + T1078.003 (Local Accounts) — historical leftover daemon accounts with /bin/sh"
category    = "hardening"

depends_on  = []
conflicts   = []
provides    = ["service-account-shell-lock"]
consumes    = []

requires    = [
    { kind = "binary", value = "chsh" },
    { kind = "binary", value = "passwd" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `audit` (default) — report findings to journal; do NOT modify.
# `enforce`        — chsh -> /usr/sbin/nologin + passwd -l for
#                    every service account (UID < 1000) that
#                    has /bin/sh or /bin/bash or similar.
default = "audit"
available = ["audit", "enforce"]

# Reserved UIDs to never touch (operator-pull safety).
# - 0 (root) — touching root is catastrophic
# - 1..3 (daemon, bin, sys) — system-critical
# Operator can extend via reserved_uids in this config.
reserved_uids = "0,1,2,3"

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/service-accounts-original.txt",
    "/etc/selfdef/modules/service-account-lock.toml",
]
