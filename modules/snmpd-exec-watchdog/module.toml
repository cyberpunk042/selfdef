name        = "snmpd-exec-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the Net-SNMP daemon command directives (/etc/snmp/snmpd.conf + /etc/snmp/snmpd.conf.d/*.conf exec/extend/extend-sh/pass/pass_persist/sh) vs a learned baseline + ownership + command scan. snmpd runs the program named in each of these directives AS ITS DAEMON USER (frequently root) and exposes the output as an SNMP OID — so the command is REMOTELY TRIGGERABLE: anyone who can query the agent (default community 'public', or a known community) fires it. A planted `extend evil /tmp/x` (or exec/pass to a writable/attacker program) is remote-triggered command execution / persistence (T1546 / T1059). Distinct from cron (time), the login/network/boot watchdogs, and postfix/aliases (mail): this is the SNMP-query-triggered exec surface. A command program under /tmp /home /dev/shm /var/tmp or with an injection pattern, a world-writable/non-root config, or any added exec directive is the signature. No-ops cleanly when snmpd is not installed"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["snmpd-exec-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any snmpd exec-config change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/snmpd-exec-watchdog.toml",
    "/usr/local/libexec/selfdef/snmpd-exec-watchdog.sh",
    "/etc/systemd/system/selfdef-snmpd-exec.service",
    "/etc/systemd/system/selfdef-snmpd-exec.timer",
    "/var/lib/selfdef/snmpd-exec-baseline.tsv",
]
