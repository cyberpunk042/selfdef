# selfdef sysctl-network-baseline — baseline profile.
# Targets common LAN/WAN kernel-network attacks.

# Source routing — accept attacker-supplied routing hints? No.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# ICMP redirect accept — accept "this gateway is better" from
# anyone on the LAN? No. Attacker-side route hijack.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Secure redirects — accept redirects only from gateways listed in
# default-gateway. Still mostly no.
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Send redirects (we are not a router unless router profile).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Reverse-path filter — strict mode drops packets whose source
# IP does not route back via the receiving interface. Prevents
# trivial spoofing.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Log packets with impossible addresses (martians) — useful for
# attacker-reconnaissance + misconfig.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore broadcast ICMP — smurf-attack defense.
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Don't reply to bogus error responses — defends against ICMP-
# based fingerprinting.
net.ipv4.icmp_ignore_bogus_error_responses = 1

# TCP syn-cookies — defends against SYN-flood DoS.
net.ipv4.tcp_syncookies = 1

# Don't accept router advertisements (we are not a host that
# needs RA-provided IPv6 prefix in most server deployments).
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# IPv6 autoconf — disable. We use static / dhcpv6-explicit.
net.ipv6.conf.all.autoconf = 0
net.ipv6.conf.default.autoconf = 0
