name        = "motd-doctrine"
version     = "0.1.0"
summary     = "Login banner (/etc/issue + /etc/issue.net + /etc/motd) — legal-warning + selfdef-presence surface. Required for CFAA-jurisdiction prosecution; deterrent + operator-status surface"
category    = "hardening"

depends_on  = []
conflicts   = []
provides    = ["login-banner"]
consumes    = []

requires    = [
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `minimal` (default) — legal-warning + selfdef-presence only
# `verbose`           — minimal + dynamic motd showing hostname,
#                       host uptime, last login info, currently-
#                       active selfdef modules (rendered at login
#                       via /etc/update-motd.d hook)
default = "minimal"
available = ["minimal", "verbose"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/issue",
    "/etc/issue.net",
    "/etc/motd",
    "/etc/update-motd.d/50-selfdef-presence",
    "/etc/selfdef/modules/motd-doctrine.toml",
]
