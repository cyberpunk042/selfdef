// selfdef package-trust-baseline — standard profile.
//
// Drops at /etc/apt/apt.conf.d/50-selfdef-secure. apt loads
// every *.conf in apt.conf.d/ in lex order; operator drops can
// override via 60-operator-trust.conf.

// === Reject insecure (unsigned) repositories ===
Acquire::AllowInsecureRepositories "false";

// === Refuse to downgrade a previously-secure repo to insecure ===
// Protects against an attacker tampering with sources.list +
// silently degrading a repo that USED to require signatures.
Acquire::AllowDowngradeToInsecureRepositories "false";

// === Require valid authentication on every package install ===
APT::Get::AllowUnauthenticated "false";

// === Reject Release files that have expired Valid-Until field ===
Acquire::Check-Valid-Until "true";

// === Reject Release files where Date is in the future ===
Acquire::Check-Date "true";

// === Sandbox apt's network workers in a seccomp profile ===
// Newer apt (>= 1.5) supports this. Drops capabilities + restricts
// syscall surface for apt's http/https workers. Reduces blast
// radius of an exploit in apt's parsing of upstream-provided
// Release/Packages files.
APT::Sandbox::Seccomp "true";

// === Disable apt-key (deprecated; use signed-by= in sources.list) ===
// apt-key adds keys to a single trust ring — operator who runs
// `apt-key add foo.gpg` permits foo's key to sign ANY repo. The
// modern pattern is per-repo signed-by= in sources.list entries.
APT::Key::AllowDeprecated "false";
