// selfdef package-trust-baseline — strict profile.

// === Inherit standard ===
Acquire::AllowInsecureRepositories "false";
Acquire::AllowDowngradeToInsecureRepositories "false";
APT::Get::AllowUnauthenticated "false";
Acquire::Check-Valid-Until "true";
Acquire::Check-Date "true";
APT::Sandbox::Seccomp "true";
APT::Key::AllowDeprecated "false";

// === Reject SHA1-signed metadata ===
// Some legacy repos still sign Release files with SHA1.
// Strict profile blocks them — operator must upgrade or replace.
Acquire::AllowSHA1InRelease "false";
Acquire::AllowWeakChecksumInRelease "false";

// === Maximum Valid-Until window ===
// Reject Release files whose Valid-Until is more than 7 days
// in the future (operator-chosen ceiling against a compromised
// signing key being used to push long-lived stale data).
Acquire::Max-ValidTime "604800";

// === Forbid suite changes (debian stable → testing without
//     operator-pull edit of sources.list) ===
Acquire::AllowReleaseInfoChange "false";
Acquire::AllowReleaseInfoChange::Suite "false";
Acquire::AllowReleaseInfoChange::Codename "false";
Acquire::AllowReleaseInfoChange::Origin "false";
Acquire::AllowReleaseInfoChange::Label "false";
Acquire::AllowReleaseInfoChange::Version "false";
