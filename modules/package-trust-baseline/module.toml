name        = "package-trust-baseline"
version     = "0.1.0"
summary     = "apt-secure tightening — block insecure repositories, refuse unsigned packages, fail on stale Release files. Mitigates T1195.002 (Supply Chain Compromise: Compromise Software Supply Chain) for apt-based distros"
category    = "hardening"

depends_on  = []
conflicts   = []
provides    = ["package-trust-tightening"]
consumes    = []

requires    = [
    { kind = "binary", value = "apt-get" },
    { kind = "binary", value = "apt-key" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `standard` (default) — block insecure repos + insecure downgrade
#                       + AllowUnauthenticated. Operator-friendly.
# `strict`            — standard + reject SHA1-signed Release +
#                       require SHA256+; Check-Valid-Until=true
#                       (rejects stale signatures).
default = "standard"
available = ["standard", "strict"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/apt/apt.conf.d/50-selfdef-secure",
    "/etc/selfdef/modules/package-trust-baseline.toml",
]
