# selfdef ssh-hardening — paranoid profile.
#
# standard + tighter:
#   - MaxAuthTries 2 (was 4)
#   - LoginGraceTime 30s (was 60s)
#   - AllowGroups ssh (requires selfdef_acknowledge_allowgroups=true)
#   - MaxStartups 2:30:10 (rate-limit unauth'd connections)
#   - DisableForwarding yes (umbrella forwarding-off)
#
# Operator MUST have an `ssh` group with their user in it BEFORE
# applying this profile. apply.sh refuse-to-brick guards via
# the acknowledge flag + sshd -t.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no
UsePAM yes

# Same crypto allowlist as standard.
KexAlgorithms curve25519-sha256@libssh.org,curve25519-sha256,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-256,rsa-sha2-512,rsa-sha2-256-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# === Umbrella forwarding off ===
DisableForwarding yes
X11Forwarding no

# === Tighter auth rate ===
MaxAuthTries 2
LoginGraceTime 30
MaxSessions 5
MaxStartups 2:30:10

# === Group restriction (REQUIRES selfdef_acknowledge_allowgroups=true) ===
# Operator MUST have an ssh group + their user as a member.
# AllowGroups is a HARD restriction — non-ssh-group users CANNOT
# log in regardless of authorized_keys. Refuse-to-brick gate
# in apply.sh.
AllowGroups ssh

ClientAliveInterval 180
ClientAliveCountMax 2

Banner /etc/issue.net
PrintLastLog yes
PrintMotd no

StrictModes yes
Subsystem sftp internal-sftp
