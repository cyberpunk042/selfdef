# selfdef ssh-hardening — standard profile.
#
# Drops at /etc/ssh/sshd_config.d/50-selfdef.conf. sshd composes
# this with /etc/ssh/sshd_config. Operator-tuned overrides at
# 60-...,99-... (lex-order LATER → overrides).

# === Authentication ===
# Root login: NEVER. Operator escalates via sudo.
PermitRootLogin no

# Password auth off; key-only. Operator MUST have a working
# ssh-key in ~/.ssh/authorized_keys BEFORE applying this — the
# refuse-to-brick guard at apply.sh time can't verify the
# operator's key works, only that sshd_config parses.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no

# Use PAM for accounting + session (matches default; pinned).
UsePAM yes

# === Strong crypto only ===
# Filter out deprecated algorithms. Allowed sets sourced from
# Mozilla's openssh "modern" baseline + NIST SP 800-131A.
KexAlgorithms curve25519-sha256@libssh.org,curve25519-sha256,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-256,rsa-sha2-512,rsa-sha2-256-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# === Disable surfaces operators rarely use ===
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no

# === Operator-facing hygiene ===
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 60
MaxAuthTries 4
MaxSessions 10

# === Banner — selfdef-pull operator-facing message ===
# Banner text at /etc/issue.net (OS-managed). Operator-prefixed
# 60-operator.conf can override.
Banner /etc/issue.net
PrintLastLog yes
PrintMotd no

# === Strict modes — sshd refuses operator-broken file perms ===
StrictModes yes

# === Subsystem: sftp via internal-sftp (no setuid sftp-server) ===
Subsystem sftp internal-sftp
