name        = "suricata"
version     = "0.1.0"
summary     = "Inline IDS via Suricata (NFQUEUE or AF_PACKET copy-mode)"
category    = "network"

depends_on  = ["bridge-l2"]
conflicts   = []

# `eve-json` is the event stream selfdef-collector-suricata already
# consumes. Any future module that wants raw IDS output can declare
# `consumes = ["eve-json"]` and the selector will refuse to enable it
# without suricata first.
provides    = ["ids", "eve-json"]
consumes    = ["l2-bridge", "forward-policy"]

requires    = [
    { kind = "binary",  value = "suricata" },
    { kind = "binary",  value = "nft" },
    { kind = "binary",  value = "systemctl" },
    { kind = "package", value = "suricata" },
]

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
default = "host-ids"
available = ["host-ids", "opnsense-bridge"]

# MS011 Z-8 / SDD-026 — install-path manifest. `scope = "system"`
# (default sovereignty: writes /etc, /usr, /var). The `paths` list
# enumerates the on-disk surfaces this module touches on apply, used
# by the dashboard's install-options surface + the install-plan
# topological sorter to surface inter-module path conflicts before
# they happen.
[install_paths]
scope = "system"
paths = ["/etc/selfdef/modules/suricata.toml", "/etc/suricata"]
