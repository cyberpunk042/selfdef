name        = "systemd-power-hooks-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the systemd power-event exec dirs (system-sleep + system-shutdown under /usr/lib/systemd, /lib/systemd, /etc/systemd) vs a learned baseline + ownership + suspicious-pattern scan. systemd runs every executable in system-sleep/ AS ROOT on suspend/hibernate/resume (pre+post) and every executable in system-shutdown/ AS ROOT at halt/poweroff/reboot/kexec. Suspend/resume fires automatically (laptop lid, idle timer), so a dropped sleep hook self-triggers without operator action; a shutdown hook runs at the last moment before power-off. A rogue script is root-exec-on-power-event persistence (T1546). Distinct from systemd-generator-watchdog (unit generators) and systemd-unit-watchdog (unit files). Symlinked dirs (/lib→/usr/lib) are de-duplicated. A script under /tmp /home /dev/shm, world-writable, non-root, or an injection pattern is the signature. No-ops cleanly when no power-hook dirs present"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["systemd-power-hooks-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any power-hook change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/systemd-power-hooks-watchdog.toml",
    "/usr/local/libexec/selfdef/systemd-power-hooks-watchdog.sh",
    "/etc/systemd/system/selfdef-systemd-power-hooks.service",
    "/etc/systemd/system/selfdef-systemd-power-hooks.timer",
    "/var/lib/selfdef/systemd-power-hooks-baseline.tsv",
]
