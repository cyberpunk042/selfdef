# selfdef pam-history — strict.
# Block reusing any of the last 24 passwords (2 years if
# operator rotates monthly). enforce_for_root=yes (no
# exception). NIST SP 800-63B v3 does NOT mandate password
# history (length + breach-DB lookup preferred); this strict
# profile is for compliance regimes (PCI DSS, HIPAA, SOX)
# that still require password history.
remember = 24
retry = 3
enforce_for_root = yes
