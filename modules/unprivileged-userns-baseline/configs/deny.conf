# selfdef unprivileged-userns-baseline — deny.
# Defeats user-namespace local PE class (CVE-2022-0185 fs_context
# heap overflow, CVE-2023-2640 OverlayFS UAF) — many require
# unprivileged userns_clone to drop into the namespace where
# the kernel bug fires.
#
# BREAKS rootless podman/docker, bubblewrap, Flatpak sandboxing.
# Apply only on hosts that don't run any of those.
kernel.unprivileged_userns_clone = 0
