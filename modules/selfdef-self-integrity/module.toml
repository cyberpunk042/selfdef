name        = "selfdef-self-integrity"
version     = "0.1.0"
summary     = "Meta-watchdog protecting the protector — hashes selfdef's own trust root (the /var/lib/selfdef/*-baseline.tsv delta-watchdog baselines + /usr/local/libexec/selfdef/*.sh wrapper scripts + /etc/selfdef/modules/*.toml configs) and alerts on tampering. Closes the who-watches-the-watchers gap: an attacker who edits a baseline to mask their backdoor is surfaced (T1562.001 / T1565.001)"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["selfdef-self-integrity"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log findings; exit 0
# `enforce`          — exit 1 on any unexpected change to a
#                     selfdef trust-root artifact
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/selfdef-self-integrity.toml",
    "/usr/local/libexec/selfdef/selfdef-self-integrity.sh",
    "/etc/systemd/system/selfdef-self-integrity.service",
    "/etc/systemd/system/selfdef-self-integrity.timer",
    "/var/lib/selfdef/self-integrity-manifest.tsv",
]
