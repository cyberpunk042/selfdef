name        = "fish-config-watchdog"
version     = "0.1.0"
summary     = "Boot + daily delta of the fish shell global config (/etc/fish/config.fish, /etc/fish/conf.d/*.fish, /etc/fish/functions/*.fish) vs a learned baseline + ownership + suspicious-pattern scan. fish sources config.fish and every /etc/fish/conf.d/*.fish at the start of each interactive (and login) fish session, and auto-loads /etc/fish/functions/*.fish by name on demand — so a planted snippet runs in the context of every fish session, an interactive-shell persistence vector (T1546) for the growing fish user base. Completes the interactive-shell-init set with shell-init-watchdog (bash/zsh global rc) and bash-completion-watchdog (bash completion drop-ins); fish is the third popular shell those do not cover. A snippet under /tmp /home /dev/shm, world-writable, non-root, or an injection pattern is the signature. No-ops cleanly when /etc/fish is absent"
category    = "detection"

depends_on  = []
conflicts   = []
provides    = ["fish-config-detection"]
consumes    = []

requires    = [
    { kind = "binary", value = "sha256sum" },
    { kind = "binary", value = "logger" },
    { kind = "binary", value = "systemctl" },
]

instanced = false
phase = "main"

[install]
kind = "script"
apply = "install/apply.sh"
check = "install/check.sh"
uninstall = "install/uninstall.sh"

[profiles]
# `report` (default) — log delta; exit 0
# `enforce`          — exit 1 on any fish config change
default = "report"
available = ["report", "enforce"]

# MS011 Z-8 / SDD-026 — install-path manifest.
[install_paths]
scope = "system"
paths = [
    "/etc/selfdef/modules/fish-config-watchdog.toml",
    "/usr/local/libexec/selfdef/fish-config-watchdog.sh",
    "/etc/systemd/system/selfdef-fish-config.service",
    "/etc/systemd/system/selfdef-fish-config.timer",
    "/var/lib/selfdef/fish-config-baseline.tsv",
]
