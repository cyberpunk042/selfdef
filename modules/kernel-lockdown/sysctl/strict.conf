# selfdef kernel-lockdown — strict profile sysctl baseline.
#
# Loaded ON TOP OF balanced.conf. Adds:
#   - kernel.modules_disabled = 1  (BLOCKS late module load)
#   - net.ipv4.conf.all.send_redirects = 0 (RFC 1812)
#   - kernel.sysrq = 0 (disable magic SysRq key)
#
# !! kernel.modules_disabled=1 is IRREVERSIBLE until reboot. Apply.sh
# refuses to set it if the operator hasn't acknowledged via the
# host config flag `acknowledge_modules_disabled = true`. This is
# the same refuse-to-brick pattern as usbguard's baseline check.
#
# Installed at /etc/sysctl.d/50-selfdef-kernel-lockdown-strict.conf.

# === Disable late module loading ===
# Once set to 1, the kernel REFUSES any further init_module /
# finit_module syscalls until reboot. Combined with the audit-rules
# module's kmod-watch surface, this is the strongest defense against
# T1547.006 Kernel Modules persistence.
kernel.modules_disabled = 1

# === Disable IPv4 send_redirects (router-only setting; hosts don't need it) ===
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# === Disable magic SysRq key combinations ===
# SysRq can crash the kernel, force reboot, dump task state — all
# operator-useful on a workstation but dangerous on a server.
# Value 0 disables; operator can opt out via host config override.
kernel.sysrq = 0
