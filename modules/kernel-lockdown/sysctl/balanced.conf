# selfdef kernel-lockdown — balanced profile sysctl baseline.
#
# Disables the highest-signal kernel attack vectors without
# breaking common operator workflows. Module loading STAYS
# enabled (strict profile disables it). Live-patching STAYS
# possible (lockdown=integrity not confidentiality).
#
# Installed at /etc/sysctl.d/50-selfdef-kernel-lockdown.conf
# (systemd-sysctl auto-loads at boot + on apply via
# `sysctl --system`).

# === kexec — block runtime kernel replacement (T1574.012 mitigation) ===
# Once set to 1, kexec_file_load/kexec_load syscalls always fail.
# A rootkit can't kexec into a fresh kernel image.
kernel.kexec_load_disabled = 1

# === Unprivileged BPF — block non-root from loading BPF programs (CVE-2021-3490 family) ===
# Privileged BPF (selfdef-collector-ebpf, Tetragon) still works
# because they run as root via systemd. Unprivileged BPF is a
# common Linux LPE primitive; disable.
kernel.unprivileged_bpf_disabled = 1

# === BPF JIT hardening — randomize BPF JIT output + constant blinding ===
# Mitigates BPF JIT spray attacks. Value 2 = randomize for all users.
net.core.bpf_jit_harden = 2

# === userfaultfd — block unprivileged userfaultfd (CVE-2022-0185 family) ===
# Unprivileged userfaultfd lets userspace handle page faults; used
# in several heap-spray + race-condition exploits. Privileged use
# remains.
vm.unprivileged_userfaultfd = 0

# === ptrace scope — non-privileged ptrace requires a parent relationship ===
# Default Ubuntu/Debian set ptrace_scope=1 already; lock it in
# explicitly so other modules / operator hand-edits don't drift it
# back to 0.
kernel.yama.ptrace_scope = 1

# === dmesg_restrict — non-root can't read dmesg (information leak block) ===
# Kernel addresses + module-load info in dmesg are useful for LPE
# kernel exploits; restrict to CAP_SYSLOG holders.
kernel.dmesg_restrict = 1

# === perf_event_paranoid — restrict perf_event_open() to privileged ===
# perf_event_open is a common LPE vector via syscall confusion.
# Value 3 disables it for unprivileged callers entirely.
kernel.perf_event_paranoid = 3

# === Disable core-dump suid binaries ===
# Coredumps of SUID processes can leak secrets readable by anyone
# in the dump's parent dir. Setting to 0 disables suid coredumps;
# 2 (root-readable-only) is a softer alternative the operator
# can pick by hand.
fs.suid_dumpable = 0

# === Hide /proc/<pid> from non-owner users (CONFIG_PROC_HIDE_PID) ===
# Requires `hidepid=2 gid=<adm>` mount option on /proc to take
# effect; this sysctl is a no-op without that mount. Operator
# documentation lives in README.
# (Provided for parity with strict profile.)

# === ASLR full ===
# kernel.randomize_va_space=2 is the kernel default in modern
# distros; pin it so no other module drifts it.
kernel.randomize_va_space = 2
