# selfdef pam-faillock — lenient profile.
#
# /etc/security/faillock.conf is consumed by pam_faillock.so. We
# REPLACE this file (it doesn't honor conf.d). Header marker for
# uninstall safety.
#
# 10 failed auths within 15min → lock for 15min.

# === Lockout threshold + window + duration ===
deny = 10
fail_interval = 900
unlock_time = 900

# === Audit silently — failed auths go to /var/log/faillog
#     and the journal; we don't ALSO need pam_faillock to print
#     to the TTY. ===
silent
no_log_info

# === Don't lock the root account ===
# Recovery side: an attacker can spam ssh to root + lock the
# root account ONLY-recovery account. Default behavior protects
# operator's last-resort recovery path.
even_deny_root
root_unlock_time = 60

# === Per-user lockfile dir ===
# faillock writes per-user state under /var/lib/faillock. Must
# exist with mode 0700 root:root for pam_faillock to function.
dir = /var/lib/faillock
