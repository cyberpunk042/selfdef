# selfdef rare-filesystems-disable — strict.
# baseline + additional. Reserved for hosts that NEVER use
# snap (squashfs) and never run NFS server.

install cramfs    /bin/true
blacklist cramfs
install freevxfs  /bin/true
blacklist freevxfs
install jffs2     /bin/true
blacklist jffs2
install hfs       /bin/true
blacklist hfs
install hfsplus   /bin/true
blacklist hfsplus
install udf       /bin/true
blacklist udf
install ksmbd     /bin/true
blacklist ksmbd

# Snap packages depend on squashfs. Block ONLY if operator
# is sure no snap is in use.
install squashfs  /bin/true
blacklist squashfs

# NFS server side (the in-kernel nfsd module). Operator
# running NFS server skips strict.
install nfsd      /bin/true
blacklist nfsd

# Cluster fs — rare on non-cluster hosts.
install gfs2      /bin/true
blacklist gfs2
