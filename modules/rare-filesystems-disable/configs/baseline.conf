# selfdef rare-filesystems-disable — baseline.
#
# `install <m> /bin/true` is the canonical defeat-modprobe
# blacklist pattern (also blacklist entries below for
# auto-load paths that consult blacklist before install).

# Compressed-RAM legacy fs — no modern operator use; kernel
# parser CVEs have appeared (CVE-2020-27194 type confusion).
install cramfs    /bin/true
blacklist cramfs

# Veritas legacy fs — no longer maintained.
install freevxfs  /bin/true
blacklist freevxfs

# Embedded NOR-flash fs — no operator workstation use.
install jffs2     /bin/true
blacklist jffs2

# Apple HFS — auto-mount-USB attack surface. No reason to
# load on a Linux server.
install hfs       /bin/true
blacklist hfs

install hfsplus   /bin/true
blacklist hfsplus

# DVD/Blu-ray fs — no modern operator use; auto-mount
# trigger on optical media insertion.
install udf       /bin/true
blacklist udf

# In-kernel SMB server (added Linux 5.15). Most operators
# either run samba in userspace OR don't need SMB at all.
install ksmbd     /bin/true
blacklist ksmbd
