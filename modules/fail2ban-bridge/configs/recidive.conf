# selfdef fail2ban-bridge — recidive jail (broad profile only).
#
# Watches /var/log/fail2ban.log for IPs that were ALREADY banned
# at least N times. Repeat offenders get a long ban (7 days) to
# eject persistent attackers from the rotation entirely.

[recidive]
enabled  = true
logpath  = /var/log/fail2ban.log
banaction = nftables-allports
maxretry = 5
findtime = 86400      # 24 hours
bantime  = 604800     # 7 days
