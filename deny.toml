# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------- advisories
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

# ---------------------------------------------------------------- licenses
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # quoted_printable (transitive via lettre, SDD-008 D-7 Q-E SMTP)
    # ships under 0BSD (Zero-Clause BSD) — strictly more permissive
    # than BSD-{2,3}-Clause; functionally public-domain-equivalent.
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "AGPL-3.0-or-later",
    "CC0-1.0",
    # webpki-roots (transitive via hyper-rustls/reqwest) ships under
    # CDLA-Permissive-2.0; it bundles Mozilla's CA list, not code we
    # incorporate into the binary as ordinary source.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

# ---------------------------------------------------------------- bans
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by path without a version, which
# cargo-deny otherwise flags as wildcards. Workspace path deps are first-
# party; the wildcard check only matters for external registry deps.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Add unmaintained or known-bad crates here as you encounter them
]
skip = []
skip-tree = []

# ---------------------------------------------------------------- sources
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
