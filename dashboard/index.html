<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff5d4d' d='M12 1 3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-4z'/%3E%3C/svg%3E" />
  <title>selfdef</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header>
    <h1>selfdef</h1>
    <div id="status" class="status">
      <span class="host">—</span>
      <span class="counters">events <strong id="event-count">—</strong></span>
      <span class="version">v<span id="crate-version">—</span> · schema <span id="schema-version">—</span></span>
      <span id="conn" class="conn">offline</span>
    </div>
  </header>

  <main>
    <section>
      <h2>Findings <small><a href="#" data-refresh="findings">refresh</a></small></h2>
      <ul id="findings" class="event-list"><li class="empty">loading…</li></ul>
    </section>

    <section>
      <h2>Events
        <small>
          <a href="#" data-refresh="events">refresh</a>
          ·
          <a href="#" id="toggle-stream">start live stream</a>
        </small>
      </h2>
      <ul id="events" class="event-list"><li class="empty">loading…</li></ul>
    </section>
  </main>

  <footer>
    <p>read-only · UNIX socket auth or bearer token</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
