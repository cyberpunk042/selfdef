publish.workspace = true
description = "IPS secret-redaction authority. Replaces detected secrets in operator-visible strings (transcripts, logs, audit dumps, error messages) with deterministic placeholders that preserve length classes and a stable per-secret token so the operator can still reason about the structure without seeing the literal value. Detection patterns: PEM blocks, JWT, AWS keys, GitHub tokens, generic 'sk-*'/'ghp_*'/'AKIA*' prefixes, common credential keys."

