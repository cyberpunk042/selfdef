[package]
name = "selfdef-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "selfdef admin CLI."

[[bin]]
name = "selfdefctl"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
selfdef-core = { workspace = true }
selfdef-config = { workspace = true }
selfdef-hardware = { workspace = true }
selfdef-store = { workspace = true }
selfdef-correlator = { workspace = true }
selfdef-signing = { workspace = true }
selfdef-notifier = { workspace = true }
selfdef-notifier-engine = { workspace = true }
selfdef-notifier-orchestrator = { workspace = true }
selfdef-integration-ntfy = { workspace = true }
selfdef-responder = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
# F-2027-010: `selfdefctl events follow --url http(s)://...`
# needs a streaming HTTP client. `reqwest` already lives in
# the workspace (selfdef-notifier pulls it for ntfy), so the
# CLI adopting it adds zero net dep size beyond the new
# `stream` feature. `futures` gives us `StreamExt::next` for
# walking `Response::bytes_stream()` chunks.
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# F-2027-006: `selfdefctl keys verify-dir` integration tests
# generate a real ed25519 keypair via the `minisign` Rust crate
# and sign fixtures with it. Mirrors the dev-dep setup the
# selfdef-signing crate uses for its own verifier suite.
minisign = "0.9"
# F-2027-010: TCP-follow integration test boots the api router
# on a 127.0.0.1:0 ephemeral port, then invokes the CLI binary
# as a subprocess against it.
axum = { workspace = true }
selfdef-api = { workspace = true, features = ["test-helpers"] }
selfdef-bus = { workspace = true }
