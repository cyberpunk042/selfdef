[package]
name = "selfdef-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "selfdef admin CLI."

[[bin]]
name = "selfdefctl"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
selfdef-core = { workspace = true }
selfdef-config = { workspace = true }
selfdef-store = { workspace = true }
selfdef-correlator = { workspace = true }
selfdef-signing = { workspace = true }
selfdef-notifier = { workspace = true }
selfdef-responder = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# F-2027-006: `selfdefctl keys verify-dir` integration tests
# generate a real ed25519 keypair via the `minisign` Rust crate
# and sign fixtures with it. Mirrors the dev-dep setup the
# selfdef-signing crate uses for its own verifier suite.
minisign = "0.9"
