description = "IPS deterministic jitter added to scheduled poll intervals. next_at(collector_id, base_ms, scheduled_ms) returns scheduled_ms + jitter where jitter is in [-max_jitter_ms/2, +max_jitter_ms/2] derived from FNV-1a(collector_id) % max_jitter_ms. Prevents two collectors from synchronising thundering-herd-style."

