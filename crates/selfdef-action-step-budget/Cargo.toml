description = "IPS per-Profile cap on the number of steps an action chain may execute before requiring re-authorization. start(action_id, profile) opens a counter; step(action_id) returns Accepted{remaining}/Exhausted{cap}/UnknownAction/Unconfigured. finish(action_id) clears the counter. Distinct from selfdef-dispatch-fanout-budget (parallel breadth) — this is the sequential-depth lane."

