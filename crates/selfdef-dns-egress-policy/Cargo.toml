description = "IPS DNS egress authority. Gates which hostnames the engine may resolve / connect to before any TCP/UDP attempt. Allow-list (with wildcard subdomains via `*.example.com`), explicit deny-list (deny wins), and a 'never_resolve' set that always denies even under wildcards. Captures the actual rule that matched so the audit trail explains the verdict."

