description = "IPS file-system watch authority. Encodes which absolute paths the engine may register a fsnotify-style watcher on. Allow-list with glob support, explicit deny-list precedence (deny wins), and a 'never watch' set (always denied even if a wildcard would otherwise allow). Designed so the engine cannot silently surveil operator-private paths."

