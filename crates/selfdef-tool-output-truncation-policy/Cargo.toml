description = "IPS tool-output truncation authority. Caps every tool's stdout/stderr at per-class budgets so a hostile tool cannot blow the operator's prompt context window via a wall of attacker-controlled text. Three strategies (HeadOnly, HeadTail, MiddleEllipsis) per tool class; returns the truncated text plus a TruncationReceipt so the cockpit can show a diff/replay link."

