description = "IPS coalescing of repeated raw collector events. Within a per-source coalesce_ms window, identical event fingerprints are merged into a single observation with first_ts/last_ts/count. observe(source, fingerprint, ts) returns Started{count:1}/Merged{count}. drain(now) returns and clears observations older than coalesce_ms."

