[package]
name = "selfdef-blockset-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "SDD-065 MS1 — IP-block backend trait + in-memory test impl. The nftables-set adapter ships in MS1b under a `nftables-backend` feature; this crate hosts the contract + a hermetic test implementation usable by selfdef-responder unit tests."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
