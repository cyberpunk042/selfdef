[package]
name = "selfdef-hardware-requirements"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Per-module [requires_hardware] gate evaluator extracted from selfdef-cli per SDD-057."
license = "AGPL-3.0-or-later"
# Private workspace crate (matches every other crate's `publish.workspace =
# true` → workspace `publish = false`). Without this it defaulted to
# publishable, which made cargo-deny flag the wildcard path-deps on it
# (the `allow-wildcard-paths` exemption doesn't apply to publishable crates).
publish.workspace = true

[dependencies]
selfdef-hardware = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
toml = { workspace = true }
