description = "IPS staged-rollout selector. Each policy_id has a Stage{Disabled / Canary{percent_ppm} / Beta{percent_ppm} / Stable}. classify(policy_id, actor_hash) returns InScope / OutOfScope / Unknown — InScope when the actor_hash falls below the stage's percent_ppm of 1_000_000. Pure deterministic selector — pairs with selfdef-policy-shadow-mode for gradual enforcement."

