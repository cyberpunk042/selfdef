description = "IPS grant-batch authority. Caps the number of distinct grants the operator can approve in a single batch transaction (max_per_batch), enforces all-or-nothing semantics, and rejects batches that mix BlastRadius tiers above a configurable max_radius_in_batch. Prevents accidentally cascading high-risk grants under a single 'approve all' click."

