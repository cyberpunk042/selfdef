description = "IPS dead-letter policy for failed bus deliveries. Each event_id has a Retry counter; record_attempt(event_id, ok) returns Retry{attempts} when failure < max_attempts, DeadLetter{attempts} when reached. Once dead-lettered, status() reports DeadLettered. revive(event_id) clears so the operator can retry by hand."

