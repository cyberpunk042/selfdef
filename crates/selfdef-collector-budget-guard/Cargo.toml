description = "IPS-side per-collector EPS budget guard. Each of the 7 collectors carries a hard EPS ceiling; if its sampled EPS exceeds the ceiling the guard returns a quarantine decision so the daemon can drop the collector off the event-bus before it floods downstream. Composes with selfdef-collector-source-taxonomy + selfdef-quarantine-engine."

