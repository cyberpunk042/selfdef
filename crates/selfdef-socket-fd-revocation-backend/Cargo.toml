[package]
name = "selfdef-socket-fd-revocation-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "SDD-073 MS1+MS5a — socket-fd revocation backend trait + in-memory test impl + filesystem-backed state-journal adapter (FsBackend). The actual fd close requires pidfd_getfd (exotic); FsBackend handles the state-journaling layer for the 27th-sibling textfile observer."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }
