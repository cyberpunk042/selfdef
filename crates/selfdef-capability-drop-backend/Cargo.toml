[package]
name = "selfdef-capability-drop-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "SDD-075 MS1+MS5a — per-process capability-drop backend trait + in-memory test impl + filesystem-backed state-journal adapter. The actual prctl(PR_CAPBSET_DROP) requires CAP_SETPCAP substrate (deferred); FsBackend handles state-journaling for the 29th-sibling textfile observer."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }
