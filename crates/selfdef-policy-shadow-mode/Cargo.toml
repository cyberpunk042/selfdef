description = "IPS shadow-mode for new/modified policies. Each policy_id has a Mode{Off/Shadow/Enforce}; classify_apply(policy_id, would_block) returns Allow/Block/ShadowBlock{recorded:true}. ShadowBlock means 'this policy would have blocked, but we let it through'. Pure decider; the recorder writes shadow events to the audit log."

