[package]
name = "selfdef-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Read-only HTTP API used by selfdefctl and the mobile dashboard."

[lints]
workspace = true

[features]
# F-2027-014: test-only helpers (specifically `with_full_capability`)
# that grant blanket auth to a router. Gated behind a feature so they
# disappear from release builds and downstream consumers can't reach
# them by accident. Tests in this crate enable it via the circular
# dev-dep below.
test-helpers = []

[dependencies]
selfdef-core = { workspace = true }
selfdef-bus = { workspace = true }
selfdef-store = { workspace = true }
selfdef-correlator = { workspace = true }
selfdef-responder = { workspace = true }
selfdef-notifier-engine = { workspace = true }
selfdef-notifier-orchestrator = { workspace = true }
selfdef-flex-profile = { workspace = true }
selfdef-grant-registry = { workspace = true }
selfdef-capability-registry = { workspace = true }
selfdef-sandbox-registry = { workspace = true }
selfdef-quarantine-registry = { workspace = true }
selfdef-trust-score-registry = { workspace = true }
selfdef-rules-registry = { workspace = true }
selfdef-friction-audit = { workspace = true }
selfdef-friction-audit-mirror = { workspace = true }
selfdef-hardware = { workspace = true }
selfdef-hardware-requirements = { workspace = true }
selfdef-perimeter = { workspace = true }
selfdef-perimeter-mirror = { workspace = true }
selfdef-guardian = { workspace = true }
selfdef-guardian-mirror = { workspace = true }
selfdef-scheduler = { workspace = true }
selfdef-scheduler-mirror = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
axum = { workspace = true, features = ["macros", "tokio"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "fs"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["server", "tokio"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
futures = { workspace = true }
time = { workspace = true }
# SDD-007 / F-2028-037: SHA-256 of the bearer-token bytes is the
# identity key for the per-token SSE subscriber quota. Stable
# 32-byte handle that doesn't store the raw secret in counter
# maps; computed once per request inside `bearer_auth`.
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
selfdef-notifier = { workspace = true }
selfdef-responder = { workspace = true }
# F-2027-030: tests need to poll streaming response frames from
# the /events/stream endpoint. http-body-util's BodyExt provides
# `.frame()` for that. Already present in the lockfile as a
# transitive dep via axum / hyper-util; pinned here so the test
# can `use` it directly.
http-body-util = "0.1"
# F-2027-014: circular dev-dep enables the `test-helpers` feature
# for this crate's own integration tests (which compile as a
# separate crate against this library). Cargo specifically supports
# this pattern for dev-deps.
selfdef-api = { path = ".", features = ["test-helpers"] }
