description = "IPS per-Profile allowlist of attachment MIME types for prompt inputs. classify(profile, mime) returns Allowed{matched_rule} / Denied{allowed_glob_set} / Unconfigured. Rules support exact ('image/png') and glob ('image/*') matches; literal '*' admits any. Distinct from selfdef-prompt-language-allowlist (text language) — this is the binary attachment lane."

