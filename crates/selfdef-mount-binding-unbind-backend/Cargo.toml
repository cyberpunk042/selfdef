[package]
name = "selfdef-mount-binding-unbind-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "SDD-071 MS1+MS5a — mount-binding unbind backend trait + in-memory test impl + filesystem-backed state-journal adapter. The actual umount2(MNT_DETACH) requires exotic substrate (deferred); FsBackend handles state-journaling for the 25th-sibling textfile observer."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }
