[package]
name = "selfdef-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "SDD-031 Deliverable 2 — Goldilocks Scheduler runtime: per-profile rule registry + 7-axis objective evaluator + 5 backpressure surfaces + decision emitter + replay engine + SHA-256 chained audit log. Implements the avx-plus-plus dump tail lines 18000-18250 scheduling architecture natively in Rust."

[[bin]]
name = "selfdef-scheduler"
path = "src/bin/selfdef-scheduler.rs"

[[bin]]
name = "selfdef-scheduler-textfile"
path = "src/bin/selfdef-scheduler-textfile.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
selfdef-scheduler-mirror = { workspace = true }
selfdef-signing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# M01172 policy-signer tests need to generate real minisign keypairs
# + signatures at runtime so we test against the actual algorithm,
# not a hardcoded fixture pair. Same dev-dep approach selfdef-cli
# uses for cli_keys_verify_dir.rs + cli_modules_apply.rs.
minisign = "0.9"
