[package]
name = "selfdef-process-env-scrub-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "SDD-074 MS1+MS5a — process-env scrub backend trait + in-memory test impl + filesystem-backed state-journal adapter (FsBackend) writing atomic JSON to /var/lib/selfdef/env-scrubs/{active,pending-restores}.json for the 28th-sibling textfile observer. The actual environ-zeroing requires process_vm_writev (exotic); FsBackend handles the state-journaling layer."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }
