description = "IPS declarative precondition checker for actions. Each action_id has a list of Precondition predicates (HasGrant(id) / NotSuspended / WithinHours{from,to} / EnvFlagPresent(name) / MinTrustScore(s) / DepActionCompleted(id)). evaluate(action_id, ctx) returns Met / Unmet{missing}. Pure descriptor; consumers feed live state in ctx."

