[package]
name = "selfdef-kernel-keyring-eviction-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "SDD-076 MS1+MS5a — kernel-keyring eviction backend trait + in-memory test impl + filesystem-backed state-journal adapter. The actual keyctl_invalidate requires CAP_SYS_ADMIN substrate (deferred); FsBackend handles state-journaling for the 30th-sibling textfile observer."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }
