description = "IPS idempotency-key ledger for action submissions. submit(key, ts) returns Fresh{recorded_at} the first time a key is seen, and Replay{first_seen_ts, recorded_outcome} for any subsequent submission of the same key within the retention window. complete(key, outcome) attaches the outcome so future replays can return it. Pure ledger; prevents double-executes on at-least-once retry."

