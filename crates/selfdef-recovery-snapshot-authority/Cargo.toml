description = "IPS recovery-snapshot authority. Maintains a bounded chronological set of restoreable snapshots with per-class retention (Hourly/Daily/Weekly) and per-class min_kept. eligible_for_eviction() returns snapshots that may be pruned without violating min_kept. select_for_recovery(now, target_time) picks the most-recent snapshot at or before the target."

