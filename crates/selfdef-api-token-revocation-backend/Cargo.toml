[package]
name = "selfdef-api-token-revocation-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "SDD-068 MS1+MS5a — API/web-token revocation backend trait + in-memory test impl + filesystem-backed production adapter (FsBackend) writing atomic JSON to /var/lib/selfdef/token-revocations/{active,pending-restores}.json for the 22nd-sibling textfile observer to scrape."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }
