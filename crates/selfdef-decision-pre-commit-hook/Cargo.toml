description = "IPS registry of pre-commit decision hooks. Each hook has (id, priority, on_block: bool) and is identified by stable id. fire_order() returns the ordered list highest-priority first; a hook with on_block=true that returns Block from the orchestrator vetoes the commit. Pure descriptor (orchestrator owns invocation); supports register/deregister and conflict-free duplicate-id detection."

