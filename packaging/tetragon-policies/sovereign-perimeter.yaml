# sovereign-perimeter.yaml — Real-Time Security Perimeter Engine
#
# Verbatim sain-01 §6 transposition (master-spec dump lines 380-411).
# This file implements MS047 D1 (TracingPolicy YAML) and binds 240 R-rows
# R11041-R11240. Installed by selfdef-daemon Debian postinst to
# /etc/tetragon/tracing-policies/sovereign-perimeter.yaml with mode 0644,
# owner root:root, then chattr +i is applied to prevent any in-place edit
# by a future intruder (operator must use selfdefctl perimeter extend +
# MS003 multi-sig to legitimately add an allowlist entry).
#
# Operator-extension contract:
#   - The four allowlist entries below are the verbatim sain-01 §6 default
#     set. Do NOT edit this file in place.
#   - To extend the allowlist, drop an MS003-signed manifest at
#     /etc/selfdef/perimeter-extensions/<id>.json (mode 0644, owner
#     root:root). The selfdef-perimeter runtime (D3) loads + verifies +
#     applies extensions out-of-band of this file, with TTL ≤ 30 days
#     per MS047 R11084. See SDD-028 §Deliverable 4 for the
#     `selfdefctl perimeter extend --signed <manifest>` flow.
#   - Tetragon must be running before this policy is loaded. The systemd
#     ordering is documented in SDD-028 §Deliverable 5 (Debian postinst).
#
# Cross-references:
#   - SDD-028 Deliverable 1
#   - MS047 R11041-R11075 (verbatim YAML structure + behavior)
#   - MS047 R11114-R11121 (Tetragon loader ordering)
#   - sain-01 §6 source: ~/infohub/raw/dumps/2026-05-15-sain-01-master-spec-*.md lines 380-411
#
# Standing rule: We do not minimize anything.

apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "sovereign-kernel-fence"
spec:
  kprobes:
  - call: "sys_execve"
    syscall: true
    args:
    - index: 0
      type: "string"
    selectors:
    - matchArgs:
      - index: 0
        operator: "NotIn"
        values:
        # ---- sain-01 §6 default allowlist (verbatim, do not edit in place) ----
        - "/usr/bin/python3"
        - "/usr/bin/nvidia-smi"
        - "/usr/local/bin/vllm"
        - "/usr/bin/podman"
        # ---- operator extensions go in /etc/selfdef/perimeter-extensions/*.json,
        #      NOT here. See sovereign-perimeter.yaml header for the contract. ----
      matchActions:
      - action: Sigkill
