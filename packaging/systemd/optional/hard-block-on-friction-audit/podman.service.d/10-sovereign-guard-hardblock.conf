# OPT-IN hard-block (selfdef F-2026-098). Drop-in for podman.service.
#
# By default sovereign-guard.service (the MS046 friction-audit hardware-
# integrity gate) is only ORDERED before the container runtimes (Before=);
# a FAILED gate is audited but does not stop them. This drop-in upgrades that
# to a hard requirement: podman will REFUSE to start unless the gate succeeded.
#
# TRADE-OFF (why this is opt-in, not default): a false-positive hardware
# reading then prevents every container on the host from starting. Enable
# only where fail-closed-at-boot is the deliberate posture and you accept that
# a flaky sensor can block workloads. See docs/sdd/027-friction-audit-system.md.
#
# Install:
#   sudo cp 10-sovereign-guard-hardblock.conf /etc/systemd/system/podman.service.d/
#   sudo systemctl daemon-reload
# Remove: delete that file + daemon-reload.
[Unit]
Requires=sovereign-guard.service
After=sovereign-guard.service
