# Drop-in for selfdefd: enable in-kernel BPF collection.
#
# Install: /etc/systemd/system/selfdefd.service.d/ebpf.conf
# Then:   systemctl daemon-reload && systemctl restart selfdefd
#
# Verifies on `journalctl -u selfdefd | grep "attached"`.

[Service]
AmbientCapabilities=CAP_AUDIT_READ CAP_BPF CAP_PERFMON
# Some kernels still charge BPF map memory against RLIMIT_MEMLOCK rather than
# the newer cgroup accounting; raise the limit to be safe.
LimitMEMLOCK=infinity
