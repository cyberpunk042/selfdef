[workspace]
resolver = "2"
members = [
    "crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://example.org/you/selfdef"
authors = ["You <you@example.org>"]
publish = false

[workspace.dependencies]
# async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# errors
thiserror = "2"
anyhow = "1"

# cryptographic signature verification (verify-only). Selected for
# its zero-dep surface and compatibility with the standalone
# `minisign` CLI operators already use to sign rules + policies.
minisign-verify = "0.2"

# logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-journald = "0.3"

# config & cli
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
serde_repr = "0.1"
serde_yaml_ng = "0.10"
toml = "0.8"
regex = "1"

# time & ids
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled", "time", "uuid"] }

# hashing — SDD-007: per-token fingerprint key for the per-token
# SSE subscriber quota in selfdef-api. Already a transitive dep
# via minisign-verify; surfacing it as a workspace dep lets the
# api crate use it directly without leaking the transitive
# version pin.
sha2 = "0.10"

# systemd integration
sd-notify = "0.4"

# http
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
async-nats = { version = "0.48", default-features = false, features = ["ring", "jetstream"] }

# email (SDD-008 D-7 Q-E: SMTP via lettre as the first email channel)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "tracing"] }

# linux primitives
inotify = "0.11"
bytemuck = { version = "1.16", features = ["derive"] }

# eBPF (userspace half — the BPF programs live in a separate workspace)
aya = "0.13"
aya-log = "0.2"

# testing
insta = { version = "1", features = ["yaml", "json"] }
proptest = "1"
tempfile = "3"
wiremock = "0.6"

# internal crates
selfdef-core = { path = "crates/selfdef-core" }
selfdef-config = { path = "crates/selfdef-config" }
selfdef-commit-authority = { path = "crates/selfdef-commit-authority" }
selfdef-execution-mode-policy = { path = "crates/selfdef-execution-mode-policy" }
selfdef-filesystem-boundary = { path = "crates/selfdef-filesystem-boundary" }
selfdef-flex-profile = { path = "crates/selfdef-flex-profile" }
selfdef-grant-registry = { path = "crates/selfdef-grant-registry" }
selfdef-grant-overlap-detector = { path = "crates/selfdef-grant-overlap-detector" }
selfdef-grant-issuance-cooldown = { path = "crates/selfdef-grant-issuance-cooldown" }
selfdef-capability-registry = { path = "crates/selfdef-capability-registry" }
selfdef-sandbox-registry = { path = "crates/selfdef-sandbox-registry" }
selfdef-quarantine-registry = { path = "crates/selfdef-quarantine-registry" }
selfdef-trust-score-registry = { path = "crates/selfdef-trust-score-registry" }
selfdef-audit-registry = { path = "crates/selfdef-audit-registry" }
selfdef-rules-registry = { path = "crates/selfdef-rules-registry" }
selfdef-cli-mirror = { path = "crates/selfdef-cli-mirror" }
selfdef-tui-mirror = { path = "crates/selfdef-tui-mirror" }
selfdef-hardware-requirements = { path = "crates/selfdef-hardware-requirements" }
selfdef-network-boundary = { path = "crates/selfdef-network-boundary" }
selfdef-profile-authority-gate = { path = "crates/selfdef-profile-authority-gate" }
selfdef-profile-mirror = { path = "crates/selfdef-profile-mirror" }
