selfdef-correlator = { path = "crates/selfdef-correlator" }
selfdef-notifier = { path = "crates/selfdef-notifier" }
selfdef-notifier-orchestrator = { path = "crates/selfdef-notifier-orchestrator" }
selfdef-notifier-engine = { path = "crates/selfdef-notifier-engine" }
selfdef-integration-ntfy = { path = "crates/selfdef-integration-ntfy" }
selfdef-integration-signal = { path = "crates/selfdef-integration-signal" }
selfdef-integration-smtp = { path = "crates/selfdef-integration-smtp" }
selfdef-integration-twilio = { path = "crates/selfdef-integration-twilio" }
selfdef-integration-wall = { path = "crates/selfdef-integration-wall" }
selfdef-integration-write = { path = "crates/selfdef-integration-write" }
selfdef-integration-slack = { path = "crates/selfdef-integration-slack" }
selfdef-integration-discord = { path = "crates/selfdef-integration-discord" }
selfdef-integration-pagerduty = { path = "crates/selfdef-integration-pagerduty" }
selfdef-integration-loki = { path = "crates/selfdef-integration-loki" }
selfdef-integration-opensearch = { path = "crates/selfdef-integration-opensearch" }
selfdef-integration-thehive = { path = "crates/selfdef-integration-thehive" }
selfdef-integration-shared-audit-summary = { path = "crates/selfdef-integration-shared-audit-summary" }
selfdef-integration-oracle-triage = { path = "crates/selfdef-integration-oracle-triage" }
selfdef-hardware = { path = "crates/selfdef-hardware" }
selfdef-responder = { path = "crates/selfdef-responder" }
selfdef-collector-auditd = { path = "crates/selfdef-collector-auditd" }
selfdef-collector-journald = { path = "crates/selfdef-collector-journald" }
selfdef-collector-tetragon = { path = "crates/selfdef-collector-tetragon" }
selfdef-collector-suricata = { path = "crates/selfdef-collector-suricata" }
selfdef-collector-canary = { path = "crates/selfdef-collector-canary" }
selfdef-collector-eventstream = { path = "crates/selfdef-collector-eventstream" }
selfdef-collector-util = { path = "crates/selfdef-collector-util" }
selfdef-collector-ebpf = { path = "crates/selfdef-collector-ebpf" }
