tests:
  - name: write under /etc/audit fires
    events:
      - { class_uid: 1001, activity_id: 3, severity_id: 4, source: auditd, file: { path: "/etc/audit/rules.d/00.rules" } }
    expected_findings: 1

  - name: replacing auditd binary fires
    events:
      - { class_uid: 1001, activity_id: 3, severity_id: 4, source: auditd, file: { path: "/usr/sbin/auditd" } }
    expected_findings: 1

  - name: unrelated /etc path does not fire
    events:
      - { class_uid: 1001, activity_id: 3, severity_id: 2, source: auditd, file: { path: "/etc/hostname" } }
    expected_findings: 0

  - name: non-auditd source does not fire (logsource gate)
    events:
      - { class_uid: 1001, activity_id: 3, severity_id: 4, source: tetragon, file: { path: "/etc/audit/audit.rules" } }
    expected_findings: 0
