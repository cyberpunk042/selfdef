title: SSH Public-Key Login Accepted
id: 6c9d0e1f-2a3b-4c5d-9e0f-112233445566
status: experimental
description: |
  An SSH session was accepted via public-key authentication. Not in itself
  malicious — informational baseline for normal operator activity. Pair
  with rate-based or geo-based rules to surface anomalies.
references:
  - https://attack.mitre.org/techniques/T1078/003/
author: selfdef
date: 2026-01-01
tags:
  - attack.defense_evasion
  - attack.t1078.003
logsource:
  service: journald
detection:
  accepted:
    raw.SYSLOG_IDENTIFIER: sshd
    raw.MESSAGE|startswith: "Accepted publickey"
  condition: accepted
level: informational
falsepositives:
  - Normal operator logins. This rule exists for baseline visibility.
