tests:
  - name: alert-tier watchdog finding over journald fires
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-dhcpd-exec","severity":"alert","event":"dhcpd_exec_suspicious","profile":"report","added":1,"removed":0,"suspicious":"execute(/tmp/x)"}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-dhcpd-exec"
          MESSAGE: '{"tag":"selfdef-dhcpd-exec","severity":"alert","event":"dhcpd_exec_suspicious"}'
    expected_findings: 1

  - name: warn-tier watchdog finding does NOT page
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-dhcpd-exec","severity":"warn","event":"dhcpd_exec_changed","profile":"report","added":1,"removed":0}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-dhcpd-exec"
    expected_findings: 0

  - name: ok-tier watchdog tick does NOT page
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-dhcpd-exec","severity":"ok","event":"dhcpd_exec_intact","profile":"report"}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-dhcpd-exec"
    expected_findings: 0

  - name: detail plain-text line does NOT page
    events:
      - source: journald
        severity_id: 1
        message: 'ADDED on-commit execute /tmp/x'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-dhcpd-exec-detail"
    expected_findings: 0

  - name: alert body from a non-selfdef identifier does NOT page
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"some-other-tool","severity":"alert","event":"x"}'
        raw:
          SYSLOG_IDENTIFIER: "some-other-tool"
    expected_findings: 0

  - name: alert-tier selfdef body but non-journald source does NOT page
    events:
      - source: tetragon
        severity_id: 1
        message: '{"tag":"selfdef-dhcpd-exec","severity":"alert","event":"x"}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-dhcpd-exec"
    expected_findings: 0

  # SDD-063: the fail-loud module-lib-missing/outdated emissions (a new
  # alert-tier class introduced by the D-6 / SDD-063 consolidation) must
  # also reach the pager — a watchdog scanning with an absent/divergent
  # policy is itself a finding.
  - name: a module_lib_missing fail-loud finding pages
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-sshd-config","severity":"alert","event":"module_lib_missing","profile":"report"}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-sshd-config"
    expected_findings: 1

  - name: a module_lib_outdated fail-loud finding pages
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-udev-rules","severity":"alert","event":"module_lib_outdated","profile":"report"}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-udev-rules"
    expected_findings: 1

  # Integrity-axis watchdogs (the non-module-lib inventory/baseline scanners)
  # emit the same `"severity":"alert"` journald shape, so the SDD-062
  # tag-prefix rule must route THEM to a Detection Finding too. These cases
  # lock that contract for a representative spread across the integrity
  # classes (file-integrity / trust / access-control / kernel-hardening /
  # name-resolution); the exact JSON bodies match what the scan scripts emit.
  - name: suid-sgid bulk-delta alert pages
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-suid-sgid","severity":"alert","event":"bulk_delta","profile":"report","added":4,"perm_change":0}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-suid-sgid"
    expected_findings: 1

  - name: file-capabilities dangerous-capability alert pages
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-file-caps","severity":"alert","event":"dangerous_capability_added","profile":"report","added":1,"dangerous":1}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-file-caps"
    expected_findings: 1

  - name: rhosts trust-backdoor alert pages
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-rhosts","severity":"alert","event":"rhosts_trust_backdoor","profile":"report","suspicious":"hosts.equiv:wildcard(+)"}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-rhosts"
    expected_findings: 1

  - name: securetty widen alert pages
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-securetty","severity":"alert","event":"securetty_widened","profile":"report","suspicious":"added-network-tty:pts/0"}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-securetty"
    expected_findings: 1

  - name: nsswitch rogue-source alert pages
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-nsswitch","severity":"alert","event":"nsswitch_rogue_source","profile":"report","suspicious":"passwd:evil"}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-nsswitch"
    expected_findings: 1

  - name: sysctl-hardening weaken alert pages
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-sysctl-hardening","severity":"alert","event":"sysctl_hardening_weakened","profile":"report","suspicious":"kernel.randomize_va_space=0"}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-sysctl-hardening"
    expected_findings: 1

  - name: an integrity-axis warn-tier finding does NOT page
    events:
      - source: journald
        severity_id: 1
        message: '{"tag":"selfdef-suid-sgid","severity":"warn","event":"suid_drift","profile":"report","added":1}'
        raw:
          SYSLOG_IDENTIFIER: "selfdef-suid-sgid"
    expected_findings: 0
