title: Security Service Stop or Disable
id: c3d4e5f6-3333-4444-9555-impact148900s
status: experimental
description: |
  `systemctl stop|disable|mask` (or `service ... stop`) against a
  security-critical service: selfdef itself, auditd, journald,
  systemd-journald. T1489 is overt impact, but this is also a
  defense-evasion precursor — stopping the daemon that ships findings
  buys an attacker quiet time before the next host check-in notices the
  gap. We treat it as **impact** because the act of stopping the service
  has a direct, observable effect on the host's defensive posture.
references:
  - https://attack.mitre.org/techniques/T1489/
author: selfdef
date: 2026-05-12
tags:
  - attack.impact
  - attack.defense_evasion
  - attack.t1489
logsource:
  service: tetragon
detection:
  systemctl_stop:
    class_uid: 1007
    activity_id: 1
    process.name:
      - systemctl
      - service
    # Match both `systemctl stop selfdefd` (verb first) and
    # `service auditd stop` (target first).
    process.cmdline|re: "(stop|disable|mask|kill)[[:space:]]+(selfdefd?|auditd|journald|systemd-journald)|(selfdefd?|auditd|journald|systemd-journald)[[:space:]]+(stop|disable|mask)"
  condition: systemctl_stop
level: critical
falsepositives:
  - Authorised maintenance windows. Use the host_tag to scope alerts to
    production hosts only if your dev / staging tier reboots services
    frequently.
