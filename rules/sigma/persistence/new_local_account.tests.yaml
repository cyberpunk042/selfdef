tests:
  - name: write to /etc/passwd fires
    events:
      - { class_uid: 1001, activity_id: 3, severity_id: 4, source: auditd, file: { path: "/etc/passwd" } }
    expected_findings: 1

  - name: write to /etc/shadow fires
    events:
      - { class_uid: 1001, activity_id: 3, severity_id: 4, source: auditd, file: { path: "/etc/shadow" } }
    expected_findings: 1

  - name: read-style activity on /etc/passwd from non-auditd source does not fire
    events:
      - { class_uid: 1001, activity_id: 2, severity_id: 1, source: tetragon, file: { path: "/etc/passwd" } }
    expected_findings: 0

  - name: unrelated path does not fire
    events:
      - { class_uid: 1001, activity_id: 3, severity_id: 2, source: auditd, file: { path: "/etc/hosts" } }
    expected_findings: 0
