name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # cosign keyless signing via OIDC

env:
  CARGO_TERM_COLOR: always
  # Reproducible-build knobs. SOURCE_DATE_EPOCH is set per-run from the
  # tagged commit. RUSTFLAGS strips workspace and cargo-registry absolute
  # paths from emitted debuginfo/metadata so the same source produces the
  # same bytes regardless of the runner's $PWD / $HOME.
  CARGO_BUILD_INCREMENTAL: "false"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: |
          cargo install --locked cargo-deb
          cargo install --locked cargo-sbom

      - name: Install coherence-harness toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats yamllint shellcheck python3-yaml

      - name: Pre-release coherence gate (10 layers)
        # Releases are tag-triggered. We re-run the four-watchdog
        # coherence harness here so a hand-tag of a commit with a
        # broken surface contract cannot ship. Build selfdefctl first
        # because L1-cli-surface invokes the built binary.
        run: |
          cargo build -p selfdef-cli --locked
          bash scripts/test/coherence.sh

      - name: Configure reproducible build env
        run: |
          # Pin file mtimes / build-stamped dates to the tagged commit.
          SDE=$(git log -1 --format=%ct "${GITHUB_SHA}")
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"
          # Strip absolute paths from emitted artifacts.
          CARGO_HOME_PATH="${CARGO_HOME:-$HOME/.cargo}"
          {
            echo "RUSTFLAGS=-C link-arg=-Wl,--as-needed \
          -C link-arg=-Wl,-z,relro,-z,now \
          --remap-path-prefix=${GITHUB_WORKSPACE}=/build \
          --remap-path-prefix=${CARGO_HOME_PATH}=/cargo"
          } >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release --locked --workspace

      - name: Build .deb
        run: cargo deb -p selfdef-daemon --no-build

      - name: Generate SBOM (CycloneDX)
        run: |
          cargo sbom --output-format cyclone_dx_json_1_5 \
            > selfdef-${{ github.ref_name }}.sbom.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign individual artifacts (keyless)
        run: |
          for f in target/debian/*.deb selfdef-*.sbom.json; do
            cosign sign-blob --yes "$f" --output-signature "$f.sig"
          done

      - name: Generate SHA256SUMS manifest
        run: |
          # Single manifest listing every release artifact's sha256 digest.
          # Downstream consumers can verify the whole release with one cosign
          # call instead of one-per-file.
          {
            sha256sum target/debian/*.deb | sed 's| .*/| |'
            sha256sum selfdef-*.sbom.json
          } > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS (keyless)
        run: |
          cosign sign-blob --yes SHA256SUMS \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            target/debian/*.deb.sig
            selfdef-*.sbom.json
            selfdef-*.sbom.json.sig
            SHA256SUMS
            SHA256SUMS.sig
            SHA256SUMS.pem
          generate_release_notes: true
