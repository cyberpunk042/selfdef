name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      # rustsec/audit-check@v2 has been observed to crash with exit code 101
      # when running its bundled cargo-audit against newer Cargo.lock files.
      # Pinning cargo-audit ourselves and running it explicitly gives us
      # deterministic behavior and matches what developers run locally.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - run: cargo audit

  python-tests:
    name: python tests (guardian + adversary + replay + ux-harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run guardian + adversary + replay + ux-harness suites
        run: |
          python3 -m unittest \
            tests.integration.test_guardian_core \
            tests.adversary.test_ms042_mismatch_scenarios \
            tests.replay.test_audit_chain_continuity \
            tests.ux-harness.test_ux_harness_l1

  ux-harness:
    name: ux coherence harness (MS045 L1+L2+L4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run MS045 UX harness (JSON output)
        run: |
          python3 scripts/ux-harness/selfdef-ux-harness --json --verbose

  build:
    name: release build
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, python-tests, ux-harness]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace
      - name: Verify binary metadata
        run: |
          file target/release/selfdefd
          ldd target/release/selfdefd || true
