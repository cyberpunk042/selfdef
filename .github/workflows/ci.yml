name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      # rustsec/audit-check@v2 has been observed to crash with exit code 101
      # when running its bundled cargo-audit against newer Cargo.lock files.
      # Pinning cargo-audit ourselves and running it explicitly gives us
      # deterministic behavior and matches what developers run locally.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - run: cargo audit

  python-tests:
    name: python tests (guardian + adversary + replay + ux-harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run guardian + adversary + replay + ux-harness suites
        run: |
          python3 -m unittest \
            tests.integration.test_guardian_core \
            tests.adversary.test_ms042_mismatch_scenarios \
            tests.replay.test_audit_chain_continuity \
            tests.ux-harness.test_ux_harness_l1

  ux-harness:
    name: ux coherence harness (MS045 L1+L2+L4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run MS045 UX harness (JSON output)
        run: |
          python3 scripts/ux-harness/selfdef-ux-harness --json --verbose

  coherence:
    name: four-watchdog coherence harness (SDD-030 / MS045 — 13 layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sister repo (info-hub) for runbook-URL existence checks
        uses: actions/checkout@v4
        with:
          repository: cyberpunk042/devops-solutions-information-hub
          path: _infohub
          # Read-only checkout — no token needed; the repo is public-ish
          # from CI's perspective. If repo becomes private, switch to a
          # PAT secret here.
      - name: Checkout sister repo (sovereign-os) for cross-repo alert-runbook binding
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: cyberpunk042/sovereign-os
          path: _sovereign-os
          # Activates L1-cross-repo-alert-runbook-binding.sh, which otherwise
          # SKIPs (the MS048 runbook ↔ sovereign-os scheduler-alert symmetry
          # would go unchecked). Same read-only/no-token pattern as info-hub
          # above; tolerant — if the checkout fails, the gate skips exactly
          # as it did before (no regression).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install bats-core + yamllint + shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats yamllint shellcheck python3-yaml
      - name: Install ruff (feeds the L1-ruff-python coherence layer)
        # Without ruff installed, scripts/test/L1-ruff-python.sh self-skips —
        # so install it here to actually run the python real-bug lint in CI.
        run: pipx install ruff
      - name: Build selfdefctl (required by L1-cli-surface gate)
        run: cargo build -p selfdef-cli --locked
      - name: Run scripts/test/coherence.sh (13 layers)
        env:
          # Enables Gate 3b in L1-prometheus-alerts.sh — verifies every
          # alert runbook_url target file actually exists in info-hub.
          INFOHUB_RUNBOOKS: ${{ github.workspace }}/_infohub/wiki/runbooks
          # Activates L1-info-hub-doc-references.sh, which otherwise looks for
          # the info-hub at ../devops-solutions-information-hub and SKIPs —
          # even though it's already checked out at _infohub above. Points it
          # at that same checkout so every info-hub doc reference is verified.
          SELFDEF_INFO_HUB_REPO: ${{ github.workspace }}/_infohub
          # Activates L1-cross-repo-alert-runbook-binding.sh against the real
          # sovereign-os tree (skips cleanly if the checkout above failed).
          SOVEREIGN_OS_REPO: ${{ github.workspace }}/_sovereign-os
        run: bash scripts/test/coherence.sh

  coherence-root:
    name: four-watchdog root suites (fixture tests needing the root sandbox — SDD-082)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats
      - name: Run root-requiring L2 watchdog suites as root
        # These suites build fixtures that need root — chown to an unresolved
        # uid/gid (unowned-files), setuid/setgid bits (suid-sgid), ownership
        # baselines (integrity-sentinel), and the time-skew chronyc fixture set
        # — so they self-skip under the non-root coherence harness (SDD-082)
        # and run here as root to keep the security detections CI-verified.
        # Pure shell (no cargo/toolchain needed).
        run: |
          sudo bats \
            packaging/test/L2-integrity-sentinel.bats \
            packaging/test/L2-suid-sgid-watchdog.bats \
            packaging/test/L2-time-skew-watchdog.bats \
            packaging/test/L2-unowned-files-watchdog.bats

  build:
    name: release build
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, python-tests, ux-harness, coherence, coherence-root]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace
      - name: Verify binary metadata
        run: |
          file target/release/selfdefd
          ldd target/release/selfdefd || true
